# Build gscore as a static page and publish it to GitHub Pages.
#
# The whole program compiles to WebAssembly, so what lands at
# https://stricaud.github.io/gscore/ is the same editor as the desktop build,
# running entirely in the browser with no server behind it.
#
# Pages must be set to "GitHub Actions" as its source, once, in the
# repository's Settings → Pages.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run already under way is left to finish rather
# than cancelled, so a half-published site is never served.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the core
        # Without cgo. The desktop window wraps the platform's own web view,
        # which on Linux means WebKitGTK headers the runner does not have —
        # and the page build does not use it, since a browser is the window
        # there. The !cgo build of internal/desktop stands in.
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

      - name: Build the page
        run: sh web/build.sh web/dist

      - name: Check what was built
        run: |
          set -eu
          for f in index.html gscore.wasm wasm_exec.js boot.js font.otf; do
            test -s "web/dist/$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          # Every file the page asks for has to be beside it. A page that
          # loads a script which is not there fails in the browser and
          # nowhere else, so it is checked here instead.
          missing=0
          for ref in $(grep -oE '(src|href)="[^"/][^":]*"' web/dist/index.html \
                       | sed -E 's/.*="([^"]*)"/\1/' | sort -u); do
            if [ ! -e "web/dist/$ref" ]; then
              echo "index.html refers to $ref, which was not built" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "wasm: $(du -h web/dist/gscore.wasm | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already. Choosing "GitHub Actions" as
          # the source in Settings does not create the site itself, and the
          # site is not created until something deploys to it — so without
          # this the first run has nowhere to go and fails here.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
