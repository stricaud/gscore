# openapi.yaml
# gscore - a musical score editor
#
# (C) Copyright 2026 Sebastien Tricaud
#
# Permission is hereby granted, free of charge, under the terms of the MIT
# licence; see the LICENSE file at the root of this repository.
#
# Every route the editor's own server answers, which is the whole program:
# the browser in front of it has no music in it at all. Anything the
# interface can do, this can be asked to do, and the score comes back as a
# PDF, a MIDI file, a web page, SVG, FLAC, or any format gscore writes.
#
# api_test.go checks this file against the server's route table, so a route
# added to the program without a line here is a failing test rather than a
# document that quietly fell behind.

openapi: 3.1.0

info:
  title: gscore
  version: 0.1.4
  summary: Write, edit and export musical scores over HTTP.
  description: |
    gscore is one program with two faces. The editor you click is a page
    served by this API, and it keeps no music of its own: every note written,
    every mark placed and every export comes through the routes below. So
    anything that can be done by hand can be done by a script, and what comes
    out is the same engraving either way.

    A running gscore serves this description at `/openapi.yaml`, so the API
    of the build in front of you can be read from the build itself.

    ## One score at a time

    The server holds a single open score — the document in the window. There
    are no score ids and no sessions: a request acts on what is open. Run one
    gscore per score you want to work on, with `gscore -headless -port N`.

    ## Piloting it

        POST /api/new                     an empty score, with one staff on it
        POST /api/insert?part=0&measure=0&at=-1&step=4&dur=quarter&kind=note
        POST /api/insert?part=0&measure=0&at=-1&step=6&dur=quarter&kind=note
        POST /api/beam?beam=join&sel=0:0:0,0:0:1
        GET  /api/pdf                     the engraving

    `at=-1` means "after whatever is there", which is how a melody is written
    by repeating one call: a bar that fills sends the next note into the bar
    after it and says where it went. Every edit is undoable, in the same
    stack the editor's Undo uses.

    A new score already has a staff, so `/api/addstaff` is for the second one
    and after — and it numbers from zero, so the staff it adds to a new score
    is `part=1`.

    ## Saying where in the music

    Most editing routes name a place in one of two ways:

    * `part`, `measure`, `at` — one element. `part` and `measure` count from
      zero; `at` counts from one and names the element *before* the cursor,
      which is where the editor leaves it after writing a note. `at=-1` or
      `at=0` means the last element of the bar.
    * `sel` — a list of elements, as `staff:measure:index` triples separated
      by commas, counting from zero: `0:0:0,0:0:1,0:1:0`. This is how a
      command reaches everything inside a dragged rectangle. Where a route
      takes both, `sel` wins.

    ## Pitch

    `step` is a position on the staff, not a MIDI note: 0 is the bottom line,
    each step is the next line or space up, and negative steps go below. What
    note that is depends on the clef, which is what makes the same number
    right for a flute and a cello. Accidentals are written separately.

    ## Errors

    A refused request answers `400` with one line of plain text saying what
    was wrong — "no such measure", "a tie joins two notes". Nothing is a
    machine-readable code: the line is written to be read.

servers:
  - url: http://127.0.0.1:8080
    description: gscore -headless -port 8080

tags:
  - name: score
    description: The document — opening it, saving it, what is in it.
  - name: export
    description: Getting the music out, as paper, sound or another program's file.
  - name: write
    description: Notes, rests and what they are made of.
  - name: marks
    description: What is written on and around the notes.
  - name: structure
    description: Bars, staves, keys, meters and the shape of the piece.
  - name: render
    description: Drawing the score, and finding out where the drawing put things.
  - name: play
    description: "Sound: MIDI, the synthesizer, and the soundfonts behind it."
  - name: app
    description: The program itself — undo, settings, files it has opened.

paths:
  # ── itself ────────────────────────────────────────────────────────────────

  /openapi.yaml:
    get:
      tags: [app]
      summary: This description, from the program it describes
      description: |
        The same file as `docs/openapi.yaml` in the repository, embedded in
        the binary rather than copied, so the two cannot drift apart. Fetch
        it from a running gscore and you have the API of that build —
        including whether it is a version that has the route you are about
        to call.
      responses:
        "200":
          description: The spec.
          content:
            application/yaml:
              schema: { type: string }

  # ── the document ──────────────────────────────────────────────────────────

  /api/info:
    get:
      tags: [score]
      summary: Everything about the open score
      description: |
        The one route worth polling. It says what the score is called, whether
        it has unsaved work, what staves it has and how many bars each holds,
        where the cursor is, and which formats this build can write.
      responses:
        "200":
          description: The score as the editor sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /api/new:
    post:
      tags: [score]
      summary: Start an empty score
      description: One empty staff, in C major and four four. Any history is forgotten with the score it belonged to.
      responses:
        "200": { $ref: "#/components/responses/Status" }

  /api/open:
    post:
      tags: [score]
      summary: Open a score sent in the request body
      description: |
        The bytes of a file, with its name in the query so the right importer
        is chosen. This is how the browser opens a file it has no path for,
        and how a script opens one without the server needing to see the disk.

        A file written with mistakes in it is read as far as it can be and
        what could not be read is reported in `info.log`, never refused
        wholesale.
      parameters:
        - name: name
          in: query
          required: true
          description: The filename, for its extension. `.abc`, `.gscore`, `.gmn` (GUIDO), `.mscz`, `.mscx`, `.musicxml`, `.xml`, `.mxl`, `.nwctxt`, `.nwc`, `.musx`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  filename: { type: string }
                  tunes:
                    type: integer
                    description: How many pieces were in it; a tune book holds many.
        "400": { $ref: "#/components/responses/Error" }

  /api/openpath:
    post:
      tags: [score]
      summary: Open a score by path
      description: Only on this machine. A browser somewhere else is refused.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  filename: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/pdfsurvey:
    get:
      tags: [score]
      summary: What the PDF reader saw
      description: >
        Reports the reading of the open PDF rather than its music: where the
        staves were found, how they were grouped into systems, and the pitch
        given to each notehead, all in the page's own coordinates so the
        answer can be drawn back over the page. A PDF says nowhere on itself
        how many staves make a system, so the grouping is inferred, and this
        is how the inference is checked. Only a PDF has one; anything else
        answers 404.
      parameters:
        - name: staves
          in: query
          required: false
          description: >
            Staves per system to survey with. Omit to use whatever the open
            score was read with; 0 means work it out from the page.
          schema: { type: integer, minimum: 0, maximum: 64 }
      responses:
        "200":
          description: The reading.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename: { type: string }
                  survey:
                    type: object
                    properties:
                      parts: { type: integer }
                      perSystem: { type: integer }
                      detected: { type: integer }
                      pages:
                        type: array
                        items: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/pdfreread:
    post:
      tags: [score]
      summary: Read the open PDF again with a given grouping
      description: >
        Reads the same bytes again, told how many staves a system holds, and
        replaces the open score with the result. Nothing is merged: a
        different grouping is a different reading of the same page, not an
        edit of what is there.
      parameters:
        - name: staves
          in: query
          required: true
          description: Staves per system; 0 means work it out from the page.
          schema: { type: integer, minimum: 0, maximum: 64 }
      responses:
        "200":
          description: Read again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  filename: { type: string }
                  staves: { type: integer }
                  parts: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }

  /api/save:
    post:
      tags: [score]
      summary: Write the score out
      description: |
        With a path, saves there. Without one, opens the platform's own save
        panel; where there is no panel it answers `needPath` with a suggested
        name rather than failing.

        Where there is no disk at all — gscore served over a network, or
        compiled into a page — there is nowhere to put a file and nothing to
        name, so the document itself comes back with a `Content-Disposition`
        for the browser to keep. That makes every save in a page a save-as.
        The bytes are the ones a file would have held: a `.gscore` written
        this way carries the drawings and the PDF of the page, which the
        plain `/api/convert` export does not.

        Saving the score clears the unsaved flag — exporting a PDF, a
        recording or a MIDI file does not, because none of those is the
        score.
      parameters:
        - name: path
          in: query
          description: Where to write it. Required unless the server is local.
          schema: { type: string }
        - name: as
          in: query
          description: |
            The format to write. Names the suggested file when a panel is
            shown, and chooses the format outright when the document is
            handed back instead.
          schema: { type: string }
        - name: pdf
          in: query
          description: "`0` writes a .gscore with no PDF of itself in front of the music."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: |
            Saved, cancelled, or asking where to put it — and, where there is
            no disk, the document itself.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  path: { type: string }
                  cancelled: { type: boolean }
                  needPath: { type: boolean }
                  suggested: { type: string }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/pickfile:
    post:
      tags: [score]
      summary: Ask the platform for a file to open
      parameters:
        - name: symbols
          in: query
          description: Offer symbol packs rather than scores.
          schema: { type: string }
        - name: picture
          in: query
          description: >
            Pick a picture to trace a symbol from, and answer with it as
            the grid the drawing window works in — the same shape
            `/api/symbolimport` gives — rather than opening anything. The
            drawing window has a file box of its own for this, which does
            nothing in the native window, since a hidden file input needs
            the shell to put a panel up and this shell does not.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: What was chosen, or that nothing was.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  filename: { type: string }
                  cancelled: { type: boolean }

  /api/recent:
    post:
      tags: [app]
      summary: The files opened before
      parameters:
        - name: clear
          in: query
          description: "`1` forgets them."
          schema: { type: string }
      responses:
        "200":
          description: The list, most recent first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: array, items: { type: string } }

  /api/tune:
    post:
      tags: [score]
      summary: Choose which piece of a tune book is open
      parameters:
        - name: i
          in: query
          required: true
          description: Its number in the book, from zero.
          schema: { type: integer }
      responses:
        "200":
          description: Which one is current now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  current: { type: integer }

  /api/header:
    post:
      tags: [score]
      summary: Title, subtitle, composer, copyright and tags
      description: >
        Only what is sent is changed, so a dialog can set one field alone.
      parameters:
        - { name: title, in: query, schema: { type: string } }
        - { name: subtitle, in: query, schema: { type: string } }
        - { name: composer, in: query, schema: { type: string } }
        - { name: copyright, in: query, schema: { type: string } }
        - name: tags
          in: query
          description: >
            What the piece is, in the words it would be looked for by, as
            one comma-separated line — "advent, flute duet, grade 3".
            Split here rather than in the editor, so that a shelf built
            from the files agrees with the window about where one tag
            ends and the next begins. Blanks and repeats are dropped;
            capitals are kept as typed, but two tags differing only in
            case are one tag. They are saved in the score, so a file
            carries its own description wherever it is copied to.
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }

  # ── getting the music out ─────────────────────────────────────────────────

  /api/pdf:
    get:
      tags: [export]
      summary: The score as a PDF
      description: |
        Engraved onto paper, each piece fitted to its own page size. This is
        the same drawing the program prints.
      parameters:
        - name: what
          in: query
          description: |
            `book` sets every piece of a tune book one after another; `parts`
            adds a part for each staff after the full score. Neither, and it
            is the open score alone.
          schema: { type: string, enum: [book, parts] }
        - name: paper
          in: query
          schema: { type: string, enum: [a4, letter], default: a4 }
        - name: orientation
          in: query
          description: A full score of twelve staves is wider than it is tall.
          schema: { type: string, enum: [portrait, landscape], default: portrait }
        - name: space
          in: query
          description: The staff space in points — the size of the type. 3 to 20.
          schema: { type: number, minimum: 3, maximum: 20 }
        - name: numbers
          in: query
          description: "`0` leaves out the bar numbers."
          schema: { type: string, enum: ["0", "1"] }
        - name: pagenumbers
          in: query
          description: "`0` leaves out the page numbers."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "500": { $ref: "#/components/responses/Error" }

  /api/convert:
    get:
      tags: [export]
      summary: The score in another program's format
      description: |
        The exporters a built gscore carries: `abc`, `gscore`, `gmn`
        (GUIDO), `ly` (LilyPond), `musicxml`, `xml`, `mxl` (compressed
        MusicXML). An
        extension nothing claims is refused by name, which is the quickest
        way to ask what a particular build can write.

        Note that `formats` in `/api/info` is a different list: the formats
        that can be *opened*, by name.
      parameters:
        - name: as
          in: query
          required: true
          description: The extension, with or without its dot.
          schema:
            type: string
            enum: [abc, gscore, ly, musicxml, xml, mxl]
      responses:
        "200":
          description: The score, written out.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/page:
    get:
      tags: [export]
      summary: The score as a web page that plays itself
      description: |
        One HTML file with the engraving and the music in it, which opens in
        any browser with nothing to install and nothing to fetch.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [page, strip] }
        - name: space
          in: query
          schema: { type: number }
        - name: font
          in: query
          description: Where the page should fetch its music font, rather than carrying it.
          schema: { type: string }
        - name: script
          in: query
          description: Likewise for its player.
          schema: { type: string }
        - name: play
          in: query
          description: "`0` leaves the player out, giving a page that only shows."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /api/midi:
    get:
      tags: [export, play]
      summary: The performance as a standard MIDI file
      responses:
        "200":
          description: The MIDI file.
          content:
            audio/midi:
              schema: { type: string, format: binary }

  /api/record:
    get:
      tags: [export, play]
      summary: The performance as audio
      description: Played through the synthesizer and written out as FLAC.
      parameters:
        - name: font
          in: query
          description: Which soundfont to play it with.
          schema: { type: string }
        - name: assign
          in: query
          description: Per-staff instrument assignment.
          schema: { type: string }
        - name: rate
          in: query
          schema: { type: integer, default: 44100 }
        - name: gain
          in: query
          schema: { type: number }
        - name: tail
          in: query
          description: Seconds of silence after the last note, for the reverb to end in.
          schema: { type: number }
        - name: reverb
          in: query
          schema: { type: string, enum: ["0", "1"] }
        - name: normalize
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: The recording.
          content:
            audio/flac:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }

  /score.svg:
    get:
      tags: [export, render]
      summary: The score as SVG
      parameters:
        - name: fit
          in: query
          description: >-
            Wrap the music to this many pixels of screen, margins
            included. For a score in a frame, which is a few hundred
            pixels wide while an unbroken strip is as wide as the tune is
            long.
          schema: { type: number }
        - name: title
          in: query
          description: >-
            `0` leaves the score's title block out, for a score shown
            inside a page that names the piece itself.
          schema: { type: string, enum: ["0", "1"] }
        - name: mode
          in: query
          description: "`strip` is the editing view, one long system; `page` is paper."
          schema: { type: string, enum: [strip, page] }
        - name: space
          in: query
          schema: { type: number }
        - name: width
          in: query
          schema: { type: number }
        - name: tune
          in: query
          description: Which piece of a tune book to draw.
          schema: { type: integer }
        - name: x0
          in: query
          description: >-
            With y0, x1 and y1: draw only the stretch of the score inside this
            box, in staff spaces. All four or none — three of them cannot be
            made sense of. The drawing keeps the full width and height of the
            whole score either way, so a coordinate in it means the same
            thing whichever was asked for. It is how the editor shows a score
            too big to put in a browser all at once.
          schema: { type: number }
        - name: y0
          in: query
          schema: { type: number }
        - name: x1
          in: query
          schema: { type: number }
        - name: y1
          in: query
          schema: { type: number }
        - name: frag
          in: query
          description: >-
            `1` writes the shapes alone, with no `<svg>` around them and no
            stylesheet: a piece to be put inside a drawing that is already
            there. The editor keeps one drawing the size of the whole score
            and fills it with these, adding the piece ahead and dropping the
            one behind, so scrolling a long score costs one piece rather
            than everything in view.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: The drawing.
          content:
            image/svg+xml:
              schema: { type: string }

  /print:
    get:
      tags: [export]
      summary: A printable page, for the browser's own print dialog
      parameters:
        - name: what
          in: query
          schema: { type: string, enum: [book, parts] }
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /api/exportsymbols:
    post:
      tags: [export]
      summary: The symbol pack, as a zip
      parameters:
        - { name: path, in: query, schema: { type: string } }
        - { name: dialog, in: query, schema: { type: string } }
      responses:
        "200":
          description: The pack, or where it was written.
          content:
            application/zip:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  path: { type: string }
                  symbols: { type: integer }
                  cancelled: { type: boolean }
                  needPath: { type: boolean }
                  suggested: { type: string }

  # ── writing notes ─────────────────────────────────────────────────────────

  /api/insert:
    post:
      tags: [write]
      summary: Write a note or a rest
      description: |
        The one call a melody is made of. A bar that is already full sends
        what is written next into the bar after it, making one if there is
        none, and the answer says where the note actually landed.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - name: at
          in: query
          description: Where in the bar. `-1` appends, which is how a tune is typed.
          schema: { type: integer, default: -1 }
        - $ref: "#/components/parameters/step"
        - name: dur
          in: query
          required: true
          schema: { $ref: "#/components/schemas/NoteValue" }
        - name: kind
          in: query
          schema: { type: string, enum: [note, rest], default: note }
        - name: dots
          in: query
          schema: { type: integer, minimum: 0, maximum: 3 }
        - name: accidental
          in: query
          schema: { $ref: "#/components/schemas/Accidental" }
        - name: midi
          in: query
          description: >-
            The note as it SOUNDS, which is what a MIDI keyboard sends.
            It comes back through the staff's own interval to what the
            player reads, and the key signature in force spells it — the
            same number is a D sharp in three sharps and an E flat in
            three flats. Overrides step and pitch.
          schema: { type: integer, minimum: 0, maximum: 127 }
        - name: drum
          in: query
          description: On a drum staff, which drum — its MIDI key — rather than where the click landed.
          schema: { type: integer }
        - name: replace
          in: query
          description: "`1` writes over what is at `at` instead of before it."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Where it went.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  measure: { type: integer }
                  at: { type: integer }
                  index: { type: integer }
                  rest: { type: boolean }
                  replaced: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }

  /api/addpitch:
    post:
      tags: [write]
      summary: Add a notehead to a note, making a chord
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - name: index
          in: query
          required: true
          description: The element in the bar, counting from zero.
          schema: { type: integer }
        - $ref: "#/components/parameters/step"
        - name: pitch
          in: query
          description: >
            The notehead named outright — "e", "eb", "e5" — instead of by
            staff position, which is how a typed or scripted chord says it.
          schema: { type: string }
        - name: midi
          in: query
          description: >-
            The note as it SOUNDS, which is what a MIDI keyboard sends.
            It comes back through the staff's own interval to what the
            player reads, and the key signature in force spells it — the
            same number is a D sharp in three sharps and an E flat in
            three flats. Overrides step and pitch.
          schema: { type: integer, minimum: 0, maximum: 127 }
        - name: above
          in: query
          description: >
            Set when a pitch with no octave is being stacked on the
            noteheads already there, which is what a chord written as a list
            of letters means: it is read from the bottom up, so "[ca]" is a
            sixth. Left off, such a pitch goes to the octave nearest the
            staff position given, which is what a click asks for.
          schema: { type: string }
        - name: accidental
          in: query
          schema: { $ref: "#/components/schemas/Accidental" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }

  /api/delete:
    post:
      tags: [write]
      summary: Take out one element, or one notehead of a chord
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - name: head
          in: query
          description: >
            The staff step of one notehead of a chord. Given, only that
            notehead goes and the chord stays — and a chord left with one
            notehead becomes a note again. Left off, the whole element
            goes.
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }

  /api/deleteselection:
    post:
      tags: [write]
      summary: Take out everything selected
      parameters:
        - $ref: "#/components/parameters/sel"
      responses:
        "200":
          description: How many went.
          content:
            application/json:
              schema:
                type: object
                properties: { removed: { type: integer } }
        "400": { $ref: "#/components/responses/Error" }

  /api/copy:
    post:
      tags: [write]
      summary: Copy a selection to the clipboard
      parameters:
        - $ref: "#/components/parameters/sel"
      responses:
        "200":
          description: How many notes were taken.
          content:
            application/json:
              schema:
                type: object
                properties: { copied: { type: integer } }
        "400": { $ref: "#/components/responses/Error" }

  /api/paste:
    post:
      tags: [write]
      summary: Put the clipboard down
      description: |
        What is pasted takes the place of what was there rather than shoving
        it along. The bar after the last one can be pasted into: it is made
        on the way, as writing a note there makes it.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - name: insert
          in: query
          description: "`1` pushes what is there along instead of replacing it."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Where it landed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pasted: { type: integer }
                  measure: { type: integer }
                  at: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/abc:
    post:
      tags: [write]
      summary: Write a line of ABC notation in at the cursor
      description: |
        The body is ABC, as it would be written inside a tune: notes, chords,
        rests, ties, slurs and barlines, with no header. It is read by the
        same parser that opens an `.abc` file, in the key and the meter
        already in force where the cursor is — ABC spells its accidentals
        against the key, so a fragment read on its own would come out in C.

        Where the bars fall is the score's business and not the fragment's:
        the music fills the bar and carries the rest into the next one, as it
        does when the notes are typed one at a time. A barline written in the
        ABC is not needed, and is not ignored either — the kind of line it is
        goes on whichever bar the note before it ended up in.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
            example: "cdef|gabc'|"
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
      responses:
        "200":
          description: How much was written, and where it ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wrote: { type: integer }
                  measure: { type: integer }
                  at: { type: integer }
                  trouble:
                    type: string
                    description: >
                      What the reader could not manage, if anything. A line
                      with one thing in it gscore does not know is still a
                      line of music, and comes back written with this filled
                      in.
        "400": { $ref: "#/components/responses/Error" }

  /api/nudge:
    post:
      tags: [write]
      summary: Move notes up or down the staff
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: steps
          in: query
          required: true
          description: Staff steps, positive up. 7 is an octave.
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/pickup:
    post:
      tags: [write]
      summary: Make the first bar an upbeat, or a whole bar again
      description: >
        A piece that begins before the first beat opens with a short bar.
        The numbering follows from that on its own: a bar short of its
        meter followed by a full one is an upbeat, and the first full bar
        is bar one. Every staff is made the same length, because bars
        stand in the same columns on all of them.
      parameters:
        - name: dur
          in: query
          description: >
            How long the upbeat is — a note length, or "none" to put the
            first bar back to its full length.
          schema: { type: string }
        - name: dots
          in: query
          description: Dots on that length.
          schema: { type: integer }
      responses:
        "200":
          description: What the first bar now holds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  of:
                    type: number
                    description: How much of a full bar the upbeat is.
                  full:
                    type: boolean
                    description: Whether the bar is a whole one again.
        "400": { $ref: "#/components/responses/Error" }

  /api/engraving:
    get:
      tags: [read]
      summary: The measurements this score is engraved by
      description: >
        The engraver works from two tables of measurements — how wide a
        quarter note's slot is, how heavy a beam is, how far apart two
        staves sit. A score may set any of them for itself, and what it
        sets is saved with it.


        The list is the engraver's own (engrave.Knobs), so a measurement
        added there appears here without this being touched, and the
        editor's dialog builds itself from what comes back. `value` is
        what this score engraves at, `default` what it would engrave at
        having said nothing, and `set` whether it has an answer of its
        own.
      responses:
        "200":
          description: Every measurement that can be set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  knobs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        label: { type: string }
                        group: { type: string }
                        unit: { type: string }
                        min: { type: number }
                        max: { type: number }
                        value: { type: number }
                        default: { type: number }
                        set: { type: boolean }
    post:
      tags: [write]
      summary: Change what this score is engraved by
      description: >
        Any number of measurements, as query parameters named after them —
        `noteBase=3.2&beamThickness=0.55`. A parameter given an empty value
        stops the score having an answer of its own for that one, and
        `reset` with no value puts the lot back to the house style.


        Nothing is applied unless all of it can be: a request with one
        number out of bounds changes nothing, because half-applied would
        leave somebody looking at a moved page and a refusal with no way
        to tell which state they are in.
      parameters:
        - name: reset
          in: query
          description: Put every measurement back to the house style.
          schema: { type: string }
      responses:
        "200":
          description: Every measurement, as it now stands.
          content:
            application/json:
              schema:
                type: object
                properties:
                  knobs: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Error" }

  /api/numbering:
    get:
      tags: [read]
      summary: How this score's bars are numbered
      responses:
        "200":
          description: How often, whether boxed, and where the count restarts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  every:
                    type: integer
                    description: >
                      Every nth bar carries a number. Zero is the default
                      and does not mean never: it means wherever the
                      engraver puts them, which is the first bar of each
                      system on a page and every bar in the editor's strip.
                  boxed:
                    type: boolean
                    description: A rectangle round each number, as a rehearsal mark has.
                  restarts:
                    type: object
                    description: >
                      The bars where the count begins again, by bar index,
                      and the number each begins at.
                    additionalProperties: { type: integer }
    post:
      tags: [write]
      summary: Change how this score's bars are numbered
      description: >
        `every` and `boxed` belong to the score. `at` with `number` restarts
        the count at a bar, and `at` with `number` empty or "none" takes
        that restart away. A restart is written on every staff, because
        "from bar forty" has to mean the same bar to everybody in the room.
      parameters:
        - name: every
          in: query
          description: Every nth bar carries a number; 0 to leave it to the engraver.
          schema: { type: integer }
        - name: boxed
          in: query
          description: 1 to box the numbers, 0 to leave them bare.
          schema: { type: string }
        - name: at
          in: query
          description: The bar a restart is written at, by index.
          schema: { type: integer }
        - name: number
          in: query
          description: >
            The number that bar is called; empty or "none" removes the
            restart.
          schema: { type: string }
      responses:
        "200":
          description: How the bars are numbered, as it now stands.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }

  /api/systems:
    get:
      tags: [read]
      summary: Where the lines of music begin
      responses:
        "200":
          description: The bars that begin a line, by bar index.
          content:
            application/json:
              schema:
                type: object
                properties:
                  breaks: { type: array, items: { type: integer } }
    post:
      tags: [write]
      summary: Say where the lines of music end
      description: >
        The engraver fits as many bars to a line as will go. A break says
        "a new line starts here", which also locks the line before it:
        where those bars end has been said, so they can no longer be moved
        about. One mechanism does both halves — "four bars to a line" is
        `fit=4`, and "stop moving them" is those breaks left where they
        are.


        `clear` is applied before `fit`, so sending both means "forget
        what was there and lay it out this way". `from` and `to` bound
        either to a stretch of bars; left out, they mean the whole piece.
        A break is written on every staff, because a line of music is a
        line on every staff at once.


        A line asked to hold more bars than fit is squeezed rather than
        quietly broken early, down to three quarters of the natural
        spacing. Past that it runs over the margin, which the writer can
        see and take back.
      parameters:
        - name: at
          in: query
          description: One bar to break before, or stop breaking before.
          schema: { type: integer }
        - name: "on"
          in: query
          description: 0 to take the break at `at` away; anything else sets it.
          schema: { type: string }
        - name: fit
          in: query
          description: Put a break every this many bars.
          schema: { type: integer }
        - name: clear
          in: query
          description: Take every break away first.
          schema: { type: string }
        - name: from
          in: query
          description: The first bar of the stretch, by index.
          schema: { type: integer }
        - name: to
          in: query
          description: The last bar of the stretch, by index.
          schema: { type: integer }
      responses:
        "200":
          description: Where the lines begin, as it now stands.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }

  /api/find:
    get:
      tags: [read]
      summary: Find words anywhere in the score
      description: >
        Words are scattered through a score in a dozen unrelated places —
        the title block, the staff names, the lyrics under every note, the
        chord symbols over them, the rehearsal marks, the movement titles,
        the word beside a metronome mark, and every "rit." or "solo"
        somebody has written. This searches all of them, in the order they
        are read: the title block, then the staff names, then the music
        from the beginning.


        Matching ignores case unless `case=1`. Writing that is empty never
        matches, so a search does not turn up every unwritten title.
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for.
          schema: { type: string }
        - name: case
          in: query
          description: 1 to match the capitals as typed.
          schema: { type: string }
      responses:
        "200":
          description: Every place the words appear.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        where:
                          type: string
                          description: >
                            What kind of writing it is — "Lyric", "Chord
                            quality", "Rehearsal mark", "Title".
                        part: { type: integer, description: -1 for the whole score }
                        measure: { type: integer, description: -1 for the whole score }
                        verse: { type: integer }
                        text: { type: string }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [write]
      summary: Change words anywhere in the score
      description: >
        The same search as the GET, so that what is replaced is exactly
        what was listed. The replacement goes in as it was typed and
        everything around it is left as it was, so a case-insensitive
        search for "flute" can put "Flûte" in place of "Flute" without
        touching the rest of the line.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: with
          in: query
          required: true
          description: What to put in its place. May be empty, which deletes it.
          schema: { type: string }
        - name: case
          in: query
          schema: { type: string }
      responses:
        "200":
          description: How many pieces of writing were changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/transpose:
    post:
      tags: [write]
      summary: Move the selection, or the whole piece, to another key
      description: >
        An interval is two numbers and not one: the semitones say what is
        heard and the steps say how it is spelled. Up four semitones and two
        letters is a major third, C to E; up four semitones and three
        letters is a diminished fourth, C to F flat.
      parameters:
        - $ref: "#/components/parameters/sel"
        - name: steps
          in: query
          description: Letters to move by, positive up. 7 is an octave.
          schema: { type: integer }
        - name: semitones
          in: query
          description: >
            Semitones to move by, positive up. Ignored when mode is
            diatonic, where the key does the spelling.
          schema: { type: integer }
        - name: mode
          in: query
          description: >
            "chromatic", the default, moves by the interval exactly.
            "diatonic" moves by letters alone and lets the key spell the
            result, so a third up is the third degree of the key.
          schema: { type: string, enum: [chromatic, diatonic] }
        - name: key
          in: query
          description: >
            "1" moves the key signatures with the music, which only happens
            when the whole piece is moving: part of a piece is still in the
            key it was in, and what moved is written with accidentals.
          schema: { type: string }
      responses:
        "200":
          description: How many notes moved, and where the key ended up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: integer }
                  left:
                    type: integer
                    description: >
                      Staves left alone, being drums or tablature, whose
                      written pitches are instruments and fingerings rather
                      than pitches.
                  fifths:
                    type: integer
                    description: The new key signature, where it moved.
        "400": { $ref: "#/components/responses/Error" }

  /api/shift:
    post:
      tags: [write]
      summary: Move notes earlier or later in the bar
      parameters:
        - $ref: "#/components/parameters/sel"
        - name: dir
          in: query
          required: true
          schema: { type: string, enum: ["-1", "1"] }
      responses:
        "200":
          description: What moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  moved: { type: integer }
                  now: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/duration:
    post:
      tags: [write]
      summary: Change how long notes last
      parameters:
        - $ref: "#/components/parameters/sel"
        - name: value
          in: query
          required: true
          schema: { $ref: "#/components/schemas/NoteValue" }
        - name: dots
          in: query
          schema: { type: integer, minimum: 0, maximum: 3 }
      responses:
        "200":
          description: What they are now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  changed: { type: integer }
                  now: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/dot:
    post:
      tags: [write]
      summary: Dot a note — again for two dots, three, then none
      description: |
        On a chord, every note in it: a dot is part of how long the note is,
        and the notes of a chord are all the same length.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
      responses:
        "200":
          description: What it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  measure: { type: integer }
                  at: { type: integer }
                  dots: { type: integer }
                  dur: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/accidental:
    post:
      tags: [write]
      summary: Write an accidental, or take one off
      description: |
        Asking for the accidental a note already has takes it off, so each
        button is its own undo. The written accidental decides how the note
        sounds; with none, the key signature decides.

        On a chord it belongs to the whole chord unless `head` names one of
        its noteheads.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: accidental
          in: query
          schema: { $ref: "#/components/schemas/Accidental" }
        - name: cycle
          in: query
          description: A step sharper or flatter, instead of naming one.
          schema: { type: string, enum: [up, down] }
        - name: parens
          in: query
          description: |
            Brackets round the sign. A bracketed accidental is a reminder
            rather than an instruction — the note sounds the same with or
            without it — so on its own, with no `accidental` and no `cycle`,
            this changes only the brackets and `toggle` turns them over. A
            note with no sign has nothing to bracket, and says so. Taking a
            sign away takes its brackets with it.
          schema: { type: string, enum: [on, off, toggle] }
        - name: head
          in: query
          description: |
            One notehead of a chord, as the staff step it sits at — half a
            space each, counted from the bottom line, the same numbering
            `steps` on a hit uses. The accidental goes on that note and no
            other. Read only when one element is being asked about: a range
            is whole chords, since a step names a different note in each.
            A step no notehead sits at is an error, not the whole chord.
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/tuplet:
    post:
      tags: [write]
      summary: Make a tuplet of the selection, or free one
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: free
          in: query
          description: >-
            `1` takes the grouping off and leaves the notes where they are,
            each written as it is drawn. Not the same as `n=1`, which
            collapses the group back into the one note it would have been
            made from.
          schema: { type: string, enum: ["0", "1"] }
        - name: n
          in: query
          description: How many in the time of how many fewer — 3 for a triplet. `0` frees it.
          schema: { type: integer }
      responses:
        "200":
          description: What was made or freed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tuplet: { type: integer }
                  members: { type: integer }
                  normal: { type: integer }
                  measure: { type: integer }
                  at: { type: integer }
                  freed: { type: integer }
                  kept: { type: integer }
                  removed: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/tremolo:
    post:
      tags: [marks]
      summary: Slashes through the stem, or between two notes
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: strokes
          in: query
          schema: { type: integer, minimum: 0, maximum: 5 }
        - name: buzz
          in: query
          schema: { type: string, enum: ["0", "1"] }
        - name: pair
          in: query
          description: >
            Between two notes rather than on one. Name both of them in sel,
            next to each other in the same bar, or name one and the mark
            pairs it with the note written after it. Clearing a tremolo
            (strokes=0) clears the whole pair, from either of its notes.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  # ── marks on the notes ────────────────────────────────────────────────────

  /api/beam:
    post:
      tags: [marks]
      summary: Beam notes together, break a beam, or leave it to the engraver
      description: |
        `join` makes the selection one group. `start` opens a group at the
        note, which is how a beam is broken without taking that note off the
        beam — the engraver closes the group before it. `break` takes the
        selection off any beam. `auto` hands the decision back.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: beam
          in: query
          schema: { type: string, enum: [join, start, break, none, auto], default: join }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/slur:
    post:
      tags: [marks]
      summary: Arc a slur over a passage
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: slur
          in: query
          description: "`none` takes it off. Anything else draws one, and needs two notes or more."
          schema: { type: string }
        - name: ends
          in: query
          description: |
            The selection is the two notes one curve runs between, which is
            what clicking the curve and pressing Backspace means. Only that
            curve goes: the start is cleared on the first note and the stop
            on the last, so the mark that opens the next phrase — or holds
            the note into the bar after — is left where it is. Without it
            both marks are cleared on every note named, which is what
            "untie this passage" means.
          schema: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/tie:
    post:
      tags: [marks]
      summary: Hold a note into the next one
      description: |
        One note is enough to say it: the note it runs to is the one that
        follows, across the barline if that is where it is. A chord is tied
        notehead by notehead — `step` names one, no step at all means all of
        them.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: tie
          in: query
          schema: { type: string, enum: [on, none], default: on }
        - name: step
          in: query
          description: One notehead of a chord.
          schema: { type: integer }
        - name: ends
          in: query
          description: |
            The selection is the two notes one curve runs between, which is
            what clicking the curve and pressing Backspace means. Only that
            curve goes: the start is cleared on the first note and the stop
            on the last, so the mark that opens the next phrase — or holds
            the note into the bar after — is left where it is. Without it
            both marks are cleared on every note named, which is what
            "untie this passage" means.
          schema: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/stem:
    post:
      tags: [marks]
      summary: Which way the stems point
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: stem
          in: query
          schema: { type: string, enum: [auto, up, down] }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/articulation:
    post:
      tags: [marks]
      summary: A staccato dot, an accent, a fermata
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: articulation
          in: query
          schema:
            type: string
            enum: [none, staccato, staccatissimo, accent, tenuto, marcato, marcato down, fermata, up-bow, down-bow]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/breath:
    post:
      tags: [marks]
      summary: Where the player breathes — a comma, a tick, a caesura
      description: >-
        The mark goes after the note and over the staff, which is where all
        of them go whichever way the stems point. "none" takes it off.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: breath
          in: query
          schema:
            type: string
            enum: [none, comma, tick, caesura, curved caesura]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/technique:
    post:
      tags: [marks]
      summary: How a fretted instrument plays the note — a hammer-on, a bend, a palm mute
      description: >-
        An empty technique clears every mark on the selection. off=1 takes
        the one named away and leaves the others, since a note can be both
        palm-muted and hammered onto.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: technique
          in: query
          schema:
            type: string
            enum: [hammer-on, pull-off, slide-up, slide-down, bend, bend-half, bend-release, pre-bend, vibrato, wide-vibrato, palm-mute, let-ring, natural-harmonic, artificial-harmonic, pinch-harmonic, tap]
        - name: "off"
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/notehead:
    post:
      tags: [marks]
      summary: The shape a note is drawn with — the x of a dead note, a diamond, a slash
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: shape
          in: query
          required: true
          description: >-
            Called shape rather than head because head already means the
            staff step of one notehead of a chord.
          schema:
            type: string
            enum: [normal, x, circle-x, triangle, diamond, slash]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/textstyles:
    get:
      tags: [marks]
      summary: The kinds of writing there are, and how each one is set
      description: >-
        Words on a score fall into a handful of kinds, and the kind decides
        the type, the slant, the weight and which side of the staff it goes
        on. The list is served rather than written down again by whatever
        is choosing from it, so there is one answer about what an
        expression marking looks like and not two.
      responses:
        "200":
          description: The styles, in the order they are offered.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    label: { type: string }
                    size:
                      type: number
                      description: The type size in staff spaces.
                    italic: { type: boolean }
                    bold: { type: boolean }
                    place: { type: string, enum: [above, below, auto] }
                    system:
                      type: boolean
                      description: >-
                        Written once over the top staff of the system, for
                        everybody, rather than over the staff it is
                        attached to.

  /api/crossstaff:
    post:
      tags: [marks]
      summary: Write a note on the staff above or below the one it belongs to
      description: >-
        What piano writing needs for a figure that runs past what one hand
        can reach. Nothing about the music changes — the same pitch, bar,
        voice and sound — only where it is drawn, and the beam crosses
        between the staves. A note with no such staff beside it is written
        where it is.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: to
          in: query
          required: true
          schema: { type: string, enum: [above, below, own] }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/pagesetup:
    get:
      tags: [structure]
      summary: The paper the score is printed on, and the sizes on offer
      responses:
        "200":
          description: The setup as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageSetup" }
    post:
      tags: [structure]
      summary: Change the paper
      description: >-
        Everything is in millimetres except the staff size, which is in
        points — that is an engraving measurement and is quoted that way
        everywhere else. Anything left out is left as it was. reset=1 puts
        the score back to following the program's own defaults, which is
        not the same as writing today's defaults into the file.
      parameters:
        - name: paper
          in: query
          schema: { type: string, enum: [a4, a3, a5, b4, letter, legal, tabloid, custom] }
        - name: landscape
          in: query
          schema: { type: string, enum: ["0", "1"] }
        - name: width
          in: query
          description: Millimetres, for a custom page.
          schema: { type: number, minimum: 50, maximum: 2000 }
        - name: height
          in: query
          description: Millimetres, for a custom page.
          schema: { type: number, minimum: 50, maximum: 2000 }
        - name: marginLeft
          in: query
          schema: { type: number, minimum: 0, maximum: 150 }
        - name: marginRight
          in: query
          schema: { type: number, minimum: 0, maximum: 150 }
        - name: marginTop
          in: query
          schema: { type: number, minimum: 0, maximum: 150 }
        - name: marginBottom
          in: query
          schema: { type: number, minimum: 0, maximum: 150 }
        - name: space
          in: query
          description: >-
            The staff size in points, or 0 to fit the music to the page.
          schema: { type: number }
        - name: reset
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The setup as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageSetup" }
        "400": { $ref: "#/components/responses/Error" }

  /api/retune:
    post:
      tags: [edit]
      summary: Retune a tablature, keeping the fingering
      description: >-
        Every string moves by the same interval and the fret numbers stay
        exactly as they are, so what sounds moves with the tuning. This is
        drop D, a guitar taken down to E flat, a capo. The other way about
        — the notes stay and the frets move — is what writing a staff as a
        tablature does, and transposing the music is /api/transpose, which
        works out the fingering again afterwards.
      parameters:
        - $ref: "#/components/parameters/part"
        - name: semitones
          in: query
          required: true
          description: How far, and which way. Up to two octaves either way.
          schema: { type: integer, minimum: -24, maximum: 24 }
      responses:
        "200":
          description: What it is tuned to now
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  changed: { type: integer }
                  tuning: { type: string }
                  strings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/fretchord:
    post:
      tags: [edit]
      summary: Write a chord onto a tablature from the shape of the hand
      description: >-
        frets is one character or field a string, lowest-sounding string
        first, the way a chord diagram is written — "x02210" is an A major
        and "x,0,2,2,10,0" says the same thing with room for frets past
        nine. x is a string that is not played. preview=1 says what the
        shape is called and writes nothing.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - name: frets
          in: query
          required: true
          schema: { type: string }
        - name: dur
          in: query
          schema: { type: string }
        - name: dots
          in: query
          schema: { type: integer }
        - name: preview
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: What was written, and what it is called
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  name: { type: string }
                  notes:
                    type: array
                    items: { type: string }
                  measure: { type: integer }
                  at: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/dynamic:
    post:
      tags: [marks]
      summary: A dynamic under the staff
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: dynamic
          in: query
          schema:
            type: string
            enum: [none, niente, pppp, ppp, pp, p, mp, mf, f, ff, fff, ffff, sfz, sf, fp, rfz]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/hairpin:
    post:
      tags: [marks]
      summary: A swell over a passage
      description: "Needs a range: a hairpin that opens and closes in the same place draws nothing."
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: hairpin
          in: query
          schema: { type: string, enum: [none, cresc, crescendo, dim, diminuendo, decrescendo] }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/octave:
    post:
      tags: [marks]
      summary: An octave line over or under a passage
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: octave
          in: query
          schema: { type: string, enum: [none, 8va, 8vb, 15ma, 15mb, "1", "-1", "2", "-2", up, down] }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/text:
    post:
      tags: [marks]
      summary: Words on a note
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - { name: text, in: query, required: true, schema: { type: string } }
        - name: style
          in: query
          description: >-
            What kind of writing it is, which decides how it is set and
            where it goes. See /api/textstyles.
          schema:
            type: string
            enum: [expression, technique, tempo, direction, plain]
        - name: placement
          in: query
          description: >-
            Which side of the staff, overriding the style. Left out, the
            style decides — which is what nearly every mark wants.
          schema: { type: string, enum: [above, below] }
        - { name: italic, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: bold, in: query, schema: { type: string, enum: ["0", "1"] } }
      responses:
        "200":
          description: What was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  text: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/lyrics:
    post:
      tags: [marks]
      summary: A line of words under a staff
      description: Syllables are split across the notes of the staff, one verse at a time.
      parameters:
        - $ref: "#/components/parameters/part"
        - { name: text, in: query, required: true, schema: { type: string } }
        - { name: verse, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: How much landed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { type: integer }
                  notes: { type: integer }
                  syllables: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/getlyrics:
    get:
      tags: [marks]
      summary: The words under a staff, as one line
      parameters:
        - $ref: "#/components/parameters/part"
        - { name: verse, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The verse.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  verse: { type: integer }
                  verses: { type: integer }
                  notes: { type: integer }

  /api/chordsymbol:
    post:
      tags: [marks]
      summary: A chord name over a note, with its fingering
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/sel"
        - name: chord
          in: query
          description: As a musician writes it — `Em6`, `Bb7`, `C/G`, `N.C.`
          schema: { type: string }
        - { name: frame, in: query, description: "A fret diagram, as a string of frets.", schema: { type: string } }
        - { name: firstfret, in: query, schema: { type: integer } }
        - { name: barre, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
      responses:
        "200":
          description: What was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  chord: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/chordfingering:
    get:
      tags: [marks]
      summary: The frets for a chord name
      parameters:
        - { name: chord, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The shape, if one is known.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chord: { type: string }
                  found: { type: boolean }
                  frets: { type: string }

  /api/chordqualities:
    get:
      tags: [marks]
      summary: What every chord quality is made of
      description: >
        Each spelling anybody types for a quality — "m7", "maj7", "M7",
        "sus4", "7b9" — against the notes it means. A tone is a degree and a
        distance: degree is how many letters above the root it is spelled
        (0 the root, 2 the third, 4 the fifth, 6 the seventh, 8 the ninth)
        and semitones how far above the root it sounds. Both, because four
        semitones above C is E or F flat and only the degree says which.
        The whole table at once, for a caller that has to look a chord up
        without being able to ask again.
      responses:
        "200":
          description: The table.
          content:
            application/json:
              schema:
                type: object
                properties:
                  qualities:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          degree: { type: integer }
                          semitones: { type: integer }

  /api/sheets:
    get:
      tags: [score]
      summary: The parts, and which one is being shown
      description: >
        A part is a view of the score, not a copy of it: it says which
        staves it prints and how it wants them laid out, and the notes it
        shows are the score's own. Which part is on the screen belongs to
        the window rather than to the file, so showing one does not change
        the score; which parts exist does belong to the file.
      responses:
        "200":
          description: The parts, in the order they are printed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  showing: { type: integer, description: "the part being shown, or -1 for the score" }
                  sheets:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        staves: { type: array, items: { type: integer } }
                        showing: { type: boolean }
                        multiRests: { type: boolean }
                        breaks: { type: integer }
                        staffSpace: { type: number }
                        cues:
                          type: array
                          items:
                            type: object
                            properties:
                              at: { type: integer }
                              bars: { type: integer }
                              from: { type: integer }
                              label: { type: string }
                        voicing:
                          type: array
                          description: >
                            Which of a shared staff's notes this part
                            prints, one rule per staff. Absent where the
                            part prints its staves whole, which is nearly
                            always.
                          items:
                            type: object
                            properties:
                              staff: { type: integer }
                              pick: { type: string, enum: [all, top, bottom, nth] }
                              nth: { type: array, items: { type: integer } }
                              fromBottom: { type: boolean }
                              single: { type: boolean }
                              layer: { type: integer }
    post:
      tags: [score]
      summary: Make the parts, show one, or change one
      description: >
        make=1 writes one part per player, which is one per staff except
        where a braced group with its barlines run through says that one
        player reads several. It refuses a score that already has parts,
        since running it twice would throw away whatever was named or
        re-laid-out in them. show takes a part's number or "score". at
        names a part to rename (name), to count the rests of (multirest),
        or to take away (remove=1).
      parameters:
        - { name: make, in: query, schema: { type: string, enum: ["1"] } }
        - { name: show, in: query, schema: { type: string } }
        - { name: at, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
        - { name: multirest, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: remove, in: query, schema: { type: string, enum: ["1"] } }
        - { name: size, in: query, schema: { type: number }, description: "how large the staff is drawn, 4 to 24; empty for the score's own size" }
        - { name: staves, in: query, schema: { type: string }, description: "which staves this part prints, counted from one: \"1, 2\"" }
        - { name: cue, in: query, schema: { type: integer }, description: "add a cue from this staff; with bar, bars and label" }
        - { name: bar, in: query, schema: { type: integer }, description: "the bar a cue begins at" }
        - { name: bars, in: query, schema: { type: integer }, description: "how many bars of it, 1 to 16" }
        - { name: label, in: query, schema: { type: string }, description: "what is written over a cue; the staff's own name where empty" }
        - { name: uncue, in: query, schema: { type: integer }, description: "take away the cue with this number" }
        - name: voice
          in: query
          description: >
            Set the voicing for this staff, by its number in the score
            counted from zero. Two players on one staff is how wind and
            brass are written: the staff carries a chord where they differ
            and one note where they agree, and each part needs its own
            line off it. The rule is read against the score's notes every
            time the part is drawn, so nothing is copied and nothing can
            go stale. Sent with pick, and with nth, frombottom, single and
            layer as the rule needs. A staff set back to pick=all keeps no
            rule at all.
          schema: { type: integer }
        - name: pick
          in: query
          description: >
            Which notes of a chord this part takes, in bars written as one
            layer: all of them, the top note, the bottom note, or notes
            counted through the chord (nth). A note written alone is
            played by both players, so top and bottom both keep it.
          schema: { type: string, enum: [all, top, bottom, nth] }
        - { name: nth, in: query, schema: { type: string }, description: "which notes of the chord, counted from one: \"2\" or \"1,3\". Required with pick=nth." }
        - { name: frombottom, in: query, schema: { type: string, enum: ["0", "1"] }, description: "count nth up from the lowest note instead of down from the highest" }
        - { name: single, in: query, schema: { type: string, enum: ["0", "1"] }, description: "with pick=nth, print a note that is alone in its bar whoever it was written for — the a2 rule" }
        - { name: layer, in: query, schema: { type: integer }, description: "in bars written with more than one layer, print this one, counted from one; 0 prints them all" }
      responses:
        "200":
          description: The parts as they now stand.
          content:
            application/json:
              schema: { type: object }
        "400":
          description: There is no such part, or the score already has parts.

  /api/setup:
    post:
      tags: [structure]
      summary: Lay a score out for the instruments chosen
      description: >
        Makes the staves for a whole ensemble at once, in score order,
        with each family bracketed and a piano given its two staves and
        its brace. gscore opens with a staff ready and that is right for
        writing a tune down; this is for somebody who already knows the
        piece is a wind quintet. The order is the one a score is laid out
        in — woodwind, brass, percussion, harp, keyboard, voices, strings
        — which is a convention about the page and not the order the
        catalogue is in, that being ordered for finding an instrument.
        Refused over a score that already has notes in it unless
        replace=1.
      parameters:
        - name: instruments
          in: query
          required: true
          description: >
            The MusicXML standard sound ids, comma separated, as
            `/api/instruments` lists them. Two of the same instrument give
            two staves.
          schema: { type: string }
        - name: order
          in: query
          description: >
            `keep` lays the staves out in the order given instead of in
            score order, for a chooser that already let somebody arrange
            them.
          schema: { type: string, enum: [score, keep] }
        - name: brackets
          in: query
          description: >
            The groups to bracket, as runs over the instruments given,
            counted from zero and inclusive: `0-1,3-5`. Given these, the
            families are not bracketed automatically — asked for a
            bracket round particular staves and then drawing the
            automatic ones as well would be two answers to one question.
            A bracket is a line down the side of a run of staves, so it
            covers everything between its ends; a chooser that lets
            somebody pick staves that are apart has to bring them
            together and send the run. A run of one draws nothing. A run
            over an instrument that reads two staves reaches round both.
          schema: { type: string }
        - name: replace
          in: query
          description: Throw away the staves of a score that has notes in it.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: What was made.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  staves: { type: integer }
                  groups: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/tunings:
    get:
      tags: [structure]
      summary: The tunings a tab staff can be written for
      description: >
        A tablature is a tuning and a number of frets, and without the
        tuning it says nothing: the same 3 on the same line is a G on a
        guitar and a C on a ukulele. The strings are listed from the top
        line of the tab down, which is how they are numbered — string 1 is
        the line at the top. That is a position on the page and not an
        order of pitch: a ukulele's fourth string is higher than its third.
      responses:
        "200":
          description: The tunings, in the order they are offered.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, description: "\"guitar\", \"guitar — drop D\"" }
                    strings: { type: array, items: { type: string }, description: "the open strings, top line down" }
                    frets: { type: integer }

  /api/fret:
    post:
      tags: [edit]
      summary: Write a note on a tab staff by the fret it stops
      description: >
        What is typed is a fret and what is stored is a pitch. A fret
        number is where a finger goes and means nothing without the
        tuning; the pitch is what sounds, what transposes and what every
        other part of the program reads. The string and fret are kept
        beside it, because which of the several places a note can be
        played was a decision somebody made. Refused on a staff that is
        not written as tablature, and on a place the instrument has not
        got.
      parameters:
        - { name: part, in: query, required: true, schema: { type: integer } }
        - { name: measure, in: query, required: true, schema: { type: integer } }
        - { name: string, in: query, required: true, schema: { type: integer }, description: "counted from the top line of the tab down, so 1 is the highest string" }
        - { name: fret, in: query, required: true, schema: { type: integer }, description: "0 is the open string" }
        - { name: at, in: query, schema: { type: integer }, description: "where in the bar; appended where absent" }
        - name: replace
          in: query
          description: >
            Change the note already at `at` instead of writing another.
            Frets run past nine and are typed a digit at a time, so a
            second digit arriving while the player is still typing means
            the twelfth fret and not a first followed by a second.
          schema: { type: string, enum: ["1"] }
        - { name: dur, in: query, schema: { type: string } }
        - { name: dots, in: query, schema: { type: string } }
      responses:
        "200":
          description: Where it went, and what it sounds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  at: { type: integer }
                  pitch: { type: string }
                  string: { type: integer }
                  fret: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/restring:
    post:
      tags: [edit]
      summary: Move a note to another string without changing what it sounds
      description: >
        The same pitch is in several places on a neck and they do not
        sound or finger alike: the open B string and the fourth fret of
        the G are the same note and a different thing to play. The pitch
        is kept and the fret is worked out again. A string that cannot
        reach the note says so and nothing moves.
      parameters:
        - { name: part, in: query, required: true, schema: { type: integer } }
        - { name: measure, in: query, required: true, schema: { type: integer } }
        - { name: at, in: query, required: true, schema: { type: integer }, description: "which element of the bar" }
        - { name: string, in: query, schema: { type: integer }, description: "the string to move to" }
        - { name: move, in: query, schema: { type: string, enum: [up, down] }, description: "a string along the neck instead; up is towards string one" }
      responses:
        "200":
          description: Where it is played now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  string: { type: integer }
                  fret: { type: integer }
                  pitch: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/plugins:
    get:
      tags: [scripts]
      summary: The scripts in the plugins folder
      description: >
        What is in Gscore/plugins, which is where scripts that belong to the
        person rather than to a score are kept. Each one carries what it
        says about itself in a comment at the top of the file — @name, @about
        and @menu — which is read and never run: the menu is built out of the
        folder without any of the scripts having been executed. A plugin with
        no @menu is in the folder and not on a menu. Empty where gscore is
        not the application on this machine: the folder is then the server's
        and its scripts are its owner's.
      responses:
        "200":
          description: The plugins, in the order a menu shows them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder: { type: string }
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        about: { type: string }
                        menu: { type: string }
                        file: { type: string }
                        body: { type: string }

  /api/chordpreview:
    get:
      tags: [marks, render]
      summary: A chord diagram, drawn
      parameters:
        - { name: chord, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: frame, in: query, schema: { type: string } }
        - { name: firstfret, in: query, schema: { type: integer } }
        - { name: barre, in: query, schema: { type: string } }
        - { name: space, in: query, schema: { type: number } }
      responses:
        "200":
          description: The diagram.
          content:
            image/svg+xml:
              schema: { type: string }

  /api/insertsymbol:
    post:
      tags: [marks]
      summary: Put a symbol from the pack into the music
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: attach, in: query, description: "Attach it to the element rather than standing it in the bar.", schema: { type: string } }
        - { name: placement, in: query, schema: { type: string, enum: [above, below] } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }

  /api/removesymbol:
    post:
      tags: [edit]
      summary: Take a symbol off the page
      description: >
        Both kinds: one standing in a bar on its own, and one a note is
        wearing. Addressed the way `/api/movesymbol` addresses one, so
        that whatever the editor has picked up can be removed without it
        having to know which kind it turned out to be. With no `name`,
        every symbol at that place goes.
      parameters:
        - { name: part, in: query, required: true, schema: { type: integer } }
        - { name: measure, in: query, required: true, schema: { type: integer } }
        - { name: at, in: query, required: true, schema: { type: integer }, description: "one past the element, as the editor addresses everything else" }
        - { name: name, in: query, schema: { type: string } }
      responses:
        "200":
          description: How many went.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  removed: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/movesymbol:
    post:
      tags: [marks]
      summary: Nudge a symbol off where it was placed
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - { name: name, in: query, schema: { type: string } }
        - { name: dx, in: query, description: "Staff spaces.", schema: { type: number } }
        - { name: dy, in: query, schema: { type: number } }
        - { name: absolute, in: query, description: "`1` sets the offset rather than adding to it.", schema: { type: string } }
      responses:
        "200":
          description: Whether it moved.
          content:
            application/json:
              schema:
                type: object
                properties: { moved: { type: boolean } }
        "400": { $ref: "#/components/responses/Error" }

  # ── the shape of the piece ────────────────────────────────────────────────

  /api/addmeasure:
    post:
      tags: [structure]
      summary: Add a bar to every staff
      responses:
        "200":
          description: How many bars there are now.
          content:
            application/json:
              schema:
                type: object
                properties: { measures: { type: integer } }

  /api/splitmeasure:
    post:
      tags: [structure]
      summary: Cut a bar in two at a note
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
      responses:
        "200":
          description: Where the cut fell.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  measure: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/insertmeasure:
    post:
      tags: [structure]
      summary: Put empty bars into the middle of the piece
      description: >
        Bars go in to the right of the one named, so the bar picked stays
        where it is and the rest of the piece moves over. Everything that
        names a bar by its number moves with it: a part's system breaks,
        the bars a cue is taken from, and where the writing cursor was
        left. A barline that is not a plain one follows the end of the run
        rather than staying in the middle of it — a repeat closing the bar
        chosen, with two bars pushed in after it, is a repeat of two bars
        more, and a final barline is the end of the piece wherever the end
        now is.
      parameters:
        - name: measure
          in: query
          description: >
            The bar the new ones follow, counted from zero. The last bar
            where it is left out.
          schema: { type: integer }
        - name: count
          in: query
          description: How many, 1 to 100. One where it is left out.
          schema: { type: integer }
        - name: where
          in: query
          description: >
            `all`, the default, puts them into every staff, which is
            nearly always right: a bar is a bar across the score and the
            barlines stay in a column. `staff` puts them into one staff
            only — a line that was typed a bar short against the rest —
            and makes the others up at the end so every staff is still
            the same length. That moves the chosen staff's music along
            relative to everybody else's, which is what it is for.
          schema: { type: string, enum: [all, staff] }
        - name: part
          in: query
          description: Which staff, with `where=staff`.
          schema: { type: integer }
      responses:
        "200":
          description: What went in, and how long the score is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  measures: { type: integer }
                  at: { type: integer }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/removemeasure:
    post:
      tags: [structure]
      summary: Take bars out of the piece
      description: >
        The way back from adding one, and not the same as emptying it: an
        emptied bar is a bar of rest, which the player counts. The bar goes
        from every staff, since a bar is a bar across the score and the
        barlines stay in a column, and everything that names a bar by its
        number moves up with the music — a part's system breaks, the bars a
        cue is taken from, where the cursor was left. A barline that is not
        a plain one stays at the end of the music, so a piece whose last bar
        is deleted still ends on its final barline. A score is never left
        with no bars at all: the last one is emptied instead of going.
      parameters:
        - name: measure
          in: query
          description: The first bar to go, counted from zero. The last bar where it is left out.
          schema: { type: integer }
        - name: count
          in: query
          description: How many, 1 to 100. One where it is left out.
          schema: { type: integer }
      responses:
        "200":
          description: How many went, and how long the score is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  removed: { type: integer }
                  measures: { type: integer }
                  at: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/joinmeasure:
    post:
      tags: [structure]
      summary: Join a bar to the one after it
      parameters:
        - $ref: "#/components/parameters/measure"
      responses:
        "200":
          description: The joined bar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  measure: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/clearmeasure:
    post:
      tags: [structure]
      summary: Empty a bar
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
      responses:
        "200":
          description: How much went.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  removed: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/measurerepeat:
    post:
      tags: [structure]
      summary: Write a bar as "play the last one again"
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - { name: bars, in: query, description: "One or two bars repeated.", schema: { type: integer, enum: [0, 1, 2] } }
      responses:
        "200":
          description: What was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  bars: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/barline:
    post:
      tags: [structure]
      summary: The line that closes a bar
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - name: style
          in: query
          required: true
          schema:
            type: string
            enum: [single, double, final, repeat-start, repeat-end, repeat-both, none]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }

  /api/ending:
    post:
      tags: [structure]
      summary: A volta bracket over bars — first time, second time
      parameters:
        - { name: measure, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, description: "The last bar it covers.", schema: { type: integer } }
        - { name: numbers, in: query, description: "Which times it is played: `1`, `2`, `1,2`.", schema: { type: string } }
        - { name: ending, in: query, description: "`none` takes it away.", schema: { type: string } }
        - { name: open, in: query, description: "A bracket with no hook at the end.", schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/jump:
    post:
      tags: [structure]
      summary: A sign or a direction — segno, coda, D.C., D.S. al fine
      parameters:
        - { name: measure, in: query, schema: { type: integer } }
        - name: sign
          in: query
          description: A mark at the bar.
          schema: { type: string, enum: [none, segno, coda, fine, tocoda] }
        - name: jump
          in: query
          description: A direction at the end of the bar.
          schema:
            type: string
            enum: [none, dc, dc-fine, dc-coda, ds, ds-fine, ds-coda]
      responses:
        "200": { $ref: "#/components/responses/Changed" }
        "400": { $ref: "#/components/responses/Error" }

  /api/marker:
    post:
      tags: [structure]
      summary: A rehearsal mark over a bar
      parameters:
        - { name: measure, in: query, schema: { type: integer } }
        - { name: text, in: query, description: "Empty takes it away.", schema: { type: string } }
      responses:
        "200":
          description: What is there now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  measure: { type: integer }
                  text: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/setkey:
    post:
      tags: [structure]
      summary: The key signature, for the piece or from a bar on
      parameters:
        - $ref: "#/components/parameters/part"
        - name: fifths
          in: query
          required: true
          description: Sharps positive, flats negative. 1 is G major, -3 is E flat.
          schema: { type: integer, minimum: -7, maximum: 7 }
        - name: at
          in: query
          description: The bar the change begins at. Without one it is the score's own key.
          schema: { type: integer }
        - name: remove
          in: query
          description: "`1` takes a change away rather than writing one."
          schema: { type: string }
      responses:
        "200":
          description: Where it was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  measure: { type: integer }
                  where: { type: string }
                  removed: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }

  /api/tempo:
    post:
      tags: [structure, play]
      summary: A metronome mark
      description: |
        A number alone says nothing: 120 in 6/8 is a different speed
        depending on whether it counts quarters or dotted quarters, so the
        beat is named with it.
      parameters:
        - { name: bpm, in: query, required: true, schema: { type: integer } }
        - name: unit
          in: query
          description: The beat it counts.
          schema: { $ref: "#/components/schemas/NoteValue" }
        - { name: dotted, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: text, in: query, description: "Words beside it — Allegro.", schema: { type: string } }
        - { name: parens, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: measure, in: query, description: "A change partway through.", schema: { type: integer } }
        - { name: remove, in: query, schema: { type: string } }
      responses:
        "200":
          description: What it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  bpm: { type: integer }
                  measure: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/addstaff:
    post:
      tags: [structure]
      summary: Add a staff
      description: |
        The key and the meter come from the score, not from nothing, and the
        clef and the transposition follow from the instrument — a new staff
        in C major under a piece in five flats would be wrong on sight.
      parameters:
        - name: written
          in: query
          description: >
            How a fretted instrument's staff is laid out: `pitches` (the
            default), `tab`, or `both` — the pair a guitar part is
            usually printed as, the notation above and the tablature
            below, joined with the barlines run through, because it is
            one player reading one line written down twice. The sound
            written into the file is the same for all three: this is how
            it is shown, not what it is. Refused for an instrument with
            no frets.
          schema: { type: string, enum: [pitches, tab, both] }
        - name: tuning
          in: query
          description: >
            Which tuning a tab is written in, and so how many lines it is
            ruled with — a line for each string. The instrument's usual
            one where this is left out; `/api/tunings` lists them. A bass
            is four strings and often five or six, and that is a tuning
            rather than a setting of its own.
          schema: { type: string }
        - name: instrument
          in: query
          description: A name — `flute`, `cello` — or a MIDI program number. `/api/instruments?flat=1` lists them. Prefer `sound`.
          schema: { type: string }
        - name: sound
          in: query
          description: >
            Which instrument this staff is, by its MusicXML standard sound
            id — `wind.reed.clarinet.bass`, `brass.euphonium`. Listed by
            `/api/instruments`. Says more than a program can: it settles the
            clef, the transposition and the range the staff is checked
            against, and it is what gets written into the file. Takes
            precedence over `instrument`.
          schema: { type: string }
        - name: lines
          in: query
          description: >-
            How many lines the staff is ruled with. One is how a drum with
            no pitch is written; five is every other staff. What is drawn
            changes and where the notes go does not.
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: clef
          in: query
          schema: { type: string, enum: [treble, bass, alto, tenor, percussion] }
        - { name: name, in: query, description: "What to call it on the page.", schema: { type: string } }
        - { name: at, in: query, description: "Where among the staves to put it.", schema: { type: integer } }
      responses:
        "200":
          description: Where it went.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  staves: { type: integer }
                  at: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/removestaff:
    post:
      tags: [structure]
      summary: Take a staff out
      parameters:
        - $ref: "#/components/parameters/part"
      responses:
        "200":
          description: How many are left.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  staves: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/movestaff:
    post:
      tags: [structure]
      summary: Move a staff up or down the score
      parameters:
        - $ref: "#/components/parameters/part"
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Where it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  at: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/staff:
    post:
      tags: [structure]
      summary: Change a staff — its name, instrument, clef, meter, transposition
      parameters:
        - $ref: "#/components/parameters/part"
        - { name: name, in: query, schema: { type: string } }
        - { name: instrument, in: query, schema: { type: string } }
        - name: sound
          in: query
          description: >
            Which instrument this staff is, by its MusicXML standard sound
            id. Listed by `/api/instruments`; settles the transposition and
            the range as well as what plays it. Takes precedence over
            `instrument`.
          schema: { type: string }
        - name: tab
          in: query
          description: >
            Write this staff as tablature, in the named tuning —
            `/api/tunings` lists them — or `off` for a staff of pitches.
            Not a change to the music: the notes keep their pitches, which
            is what sounds and what transposes, and a staff turned to tab
            and back is the staff it was. Notes already on it are given a
            place on the neck.
          schema: { type: string }
        - { name: clef, in: query, schema: { type: string, enum: [treble, bass, alto, tenor, percussion] } }
        - { name: time, in: query, description: "A meter, as `4/4` or `6/8`.", schema: { type: string } }
        - { name: at, in: query, description: "The bar a meter change begins at.", schema: { type: integer } }
        - { name: transpose, in: query, description: "Semitones below what is written.", schema: { type: integer } }
        - { name: hidden, in: query, description: "Out of the drawing, still in the score.", schema: { type: string, enum: ["0", "1"] } }
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  changed: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/group:
    post:
      tags: [structure]
      summary: Brace or bracket a run of staves together
      parameters:
        - { name: first, in: query, required: true, schema: { type: integer } }
        - { name: last, in: query, required: true, schema: { type: integer } }
        - { name: symbol, in: query, schema: { type: string, enum: [brace, line, none] } }
        - { name: name, in: query, schema: { type: string } }
        - { name: barlines, in: query, description: "Run the barlines through the gaps.", schema: { type: string, enum: ["0", "1"] } }
      responses:
        "200":
          description: The groups now in the score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  groups: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  # ── drawing, and where the drawing put things ─────────────────────────────

  /api/layout:
    get:
      tags: [render]
      summary: How big the drawing is
      description: >-
        For the view asked about, not for whatever the application was last
        set to: a strip and a page of the same music are nothing like the
        same shape. The editor asks before drawing, because the size is what
        says whether a score has to be drawn a screenful at a time.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [strip, page] }
        - name: space
          in: query
          schema: { type: number }
        - name: width
          in: query
          schema: { type: number }
        - name: tune
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: In staff spaces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  width: { type: number }
                  height: { type: number }

  /api/hits:
    get:
      tags: [render]
      summary: Where everything landed on the page
      description: |
        The engraver is the only thing that knows where a note went, and this
        is it saying so: one region per bar, with every element's position in
        staff spaces, plus the barlines, the dynamics, the hairpins, the
        ties and slurs, the tremolos, the tempo marks and the bands over each
        bar. A click becomes a place in the music by looking it up here.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [strip, page] }
      responses:
        "200":
          description: The map.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hits" }

  /api/flute:
    get:
      tags: [score]
      summary: The flute's fingerings, every one of them
      description: |
        The chart in the back of a method book gives one fingering a note.
        This gives every one the instrument has — some twenty-nine thousand
        — with how far out of tune each comes out and how many keys it is
        from the standard chart. Those two are what make the table usable:
        the alternate a player would reach for is one key from the chart
        and in tune, and the ones eleven keys away are an acoustic model
        saying a note can be got out of a shape nobody would use.

        With no parameters it answers about the instrument: the key names,
        how many belong to the left hand, and the notes it plays. With
        `note` it answers about one note. With `from` and `to` it answers
        with the ways of trilling between two notes — a trill being one
        fingering for each, differing by the single key that shakes.
      parameters:
        - name: note
          in: query
          description: The note, as a name with an octave — `D5`, `A#4`.
          schema: { type: string }
        - { name: from, in: query, description: "The lower note of a trill.", schema: { type: string } }
        - { name: to, in: query, description: "The upper note of a trill.", schema: { type: string } }
        - name: away
          in: query
          description: At most this many keys different from the standard chart.
          schema: { type: integer, minimum: 0 }
        - name: within
          in: query
          description: At most this many cents out of tune, either way.
          schema: { type: integer, minimum: 0 }
        - name: using
          in: query
          description: Only fingerings that hold all of these keys, by name, comma separated.
          schema: { type: string }
        - name: without
          in: query
          description: Only fingerings that hold none of these keys.
          schema: { type: string }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 60 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: >
            The instrument, and whichever of the note or the trill was
            asked for. `keys` is the key names in the order a fingering's
            bits are in, `left` how many of them are the left hand's.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: string } }
                  left: { type: integer }
                  notes: { type: array, items: { type: string } }
                  note: { type: string }
                  standard: { type: object }
                  total: { type: integer }
                  shown: { type: array, items: { type: object } }
                  from: { type: string }
                  to: { type: string }
                  trills: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Error" }

  /api/harmonics:
    get:
      tags: [play, score]
      summary: What the harmony at one moment is made of
      description: |
        The notes sounding at a moment, the partials each of them carries,
        where those partials meet, how far equal temperament has bent each
        interval from the ratio it is named after, and how rough the result
        is.

        Worked out from the written notes, not from the audio: a spectrum
        taken off the sound shows the soundfont — its samples, its filters,
        its reverb — and gives a different answer for the same chord on
        another instrument. The question this answers is about the notes, so
        it answers before anything is played and answers the same way every
        time.

        `roughness` is in semitones: 1 is exactly as rough as two notes a
        semitone apart in the middle of the staff, averaged over the
        intervals in the chord. A fifth is about 0.19, a major third 0.49,
        a major triad 0.39.
      parameters:
        - name: at
          in: query
          description: The moment, in seconds along the performance.
          schema: { type: number, default: 0 }
        - name: ref
          in: query
          description: |
            A notehead, named the way the engraver numbers them. The moment
            is when that note sounds — "what else is playing when this note
            does", which is the question somebody writing a chord is asking.
            Wins over `at`.
          schema: { type: integer }
        - name: measure
          in: query
          description: A bar, counting from zero; the moment is where it begins.
          schema: { type: integer }
        - name: partials
          in: query
          description: How far up each note's series to look, 1 to 32.
          schema: { type: integer, default: 8, minimum: 1, maximum: 32 }
        - name: rolloff
          in: query
          description: |
            How fast the partials get quieter going up, as the power the
            harmonic number is raised to. 1 is the textbook sawtooth; a
            flute is steeper and a reed shallower.
          schema: { type: number, default: 1 }
      responses:
        "200":
          description: The harmony at that moment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Harmonics" }

  /api/reach:
    get:
      tags: [score]
      summary: How far each staff reaches, and whether its instrument can go there
      description: |
        For every staff: its lowest and highest sounding note with the bar
        each falls in, the stretch it spends its time in, what its
        instrument can play, and anything worth saying about the two
        together.

        Sounding rather than written, because a range is a physical fact
        about an instrument and does not move because the part is spelled in
        another key: a clarinet's bottom note is the same note either way.
        The part's transposition and any octave line over it are applied.

        Findings come in two kinds and are never run together. `impossible`
        is a fact — the instrument does not have the note and it will not be
        played. `strain` is a judgement — the part sits outside the
        comfortable stretch for long enough to tire a player out, which the
        top of a trumpet part is allowed to do and forty bars of it is not.

        An instrument gscore does not have a range for gets `playable` and
        `easy` left out and no findings at all; a guessed range would be
        worse than a blank, because a composer who cannot tell which is
        which can use neither. A percussion staff is reported as
        `percussion` and nothing else: its lines are places on a kit rather
        than pitches.
      responses:
        "200":
          description: One entry per staff, in staff order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items: { $ref: "#/components/schemas/PartReach" }

  /api/keys:
    get:
      tags: [score]
      summary: What key the music is in, through the piece
      description: |
        Not what the key signature says. A signature is written once and
        stands until somebody writes another one; the music moves through
        keys inside it all the time, and where it moves is most of what
        there is to understand about a piece. The development of a sonata
        is the signature of the exposition and almost none of its keys.

        Read by Krumhansl and Schmuckler's method: how long each of the
        twelve pitch classes sounds over the four bars around each bar,
        correlated against profiles of how long each degree sounds in music
        known to be in a key. The profiles are Krumhansl and Kessler's, out
        of listening experiments, so what is matched against is what
        listeners report. Every pitched staff counts, because the key is
        the piece's and not any one staff's.

        The answer is gathered into the stretches where it stays the same.
        Two bars have to agree before a change is believed, so a secondary
        dominant is not reported as a modulation, and bars with nothing in
        them carry the key through rather than breaking it.

        `clear` says the reading stands far enough above the next best key
        to be stated plainly. Where it is false the stretch is music that
        does not settle anywhere, which is a true thing to know about it.
      responses:
        "200":
          description: The piece's keys, in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bars: { type: integer, description: How many bars the piece has. }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        fromBar: { type: integer }
                        toBar: { type: integer }
                        key:
                          type: object
                          properties:
                            tonic: { type: integer }
                            minor: { type: boolean }
                        name:
                          type: string
                          description: >
                            Spelled the way the page is spelled: a stretch
                            in a piece of four sharps is G♯ major, not A♭.
                        fit: { $ref: "#/components/schemas/Fit" }
                        clear: { type: boolean }

  /api/map:
    get:
      tags: [score]
      summary: The shape of the piece — who plays when, and what repeats what
      description: |
        Two answers about the whole of a piece rather than about a moment.

        `staves` is how many notes each staff has in each bar: not how loud
        it is and not how important, but how much is written there, which is
        what shows an entry, a tutti and a staff that rests for eighty bars.

        `echoes` is every stretch of bars that is a stretch heard earlier.
        A bar is compared by its content with its pitches counted from its
        own lowest note, so the same phrase a fifth higher is the same
        phrase and a sequence is found as well as a literal return;
        `transposed` says how far it has moved, in semitones, and is zero
        for the same notes again. Each bar is reported once, as part of the
        longest return it belongs to, and against the earliest place that
        music was heard: the recapitulation of a sonata is a return of the
        exposition and not of the development's quotation of it.

        A return has to run to `least` bars to be reported, two by default.
        One bar coming back is an accompaniment figure, and a list of every
        bar of an Alberti bass matching the one before it is a list of
        nothing. Bars with no notes are a return of nothing, however exactly
        their rests match.
      parameters:
        - name: least
          in: query
          description: How many bars a return must run to before it is reported.
          schema: { type: integer, default: 2, minimum: 1, maximum: 64 }
      responses:
        "200":
          description: The shape of it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bars: { type: integer }
                  busiest:
                    type: integer
                    description: The most notes any staff has in any one bar.
                  staves:
                    type: array
                    items:
                      type: object
                      properties:
                        part: { type: integer }
                        name: { type: string }
                        bars: { type: array, items: { type: integer } }
                        notes: { type: integer }
                        playing:
                          type: integer
                          description: How many bars the staff plays in at all.
                  echoes:
                    type: array
                    items:
                      type: object
                      properties:
                        fromBar: { type: integer }
                        toBar: { type: integer }
                        likeBar:
                          type: integer
                          description: Where the same music was first heard.
                        bars: { type: integer }
                        transposed:
                          type: integer
                          description: How far it has moved, in semitones.

  /api/voices:
    get:
      tags: [score]
      summary: How the lines move against each other
      description: |
        The one part of the analysis that judges rather than measures.

        Parallel fifths are not wrong; they are wrong *in a tradition* —
        roughly, European art music between Palestrina and Brahms — and
        they are the whole sound of organum, of Debussy, of most film music
        and of every power chord ever played. So nothing here is sent as an
        error. Each finding says what was seen, where, and in which pair of
        lines, and the composer decides whether it is what they meant.

        What is found is only what is unarguable once the tradition is
        granted: two lines moving in parallel perfect fifths, octaves or
        unisons, a line crossing under one written below it, and a line
        moving past where its neighbour just was. The contested rules —
        hidden fifths, unresolved leading tones, unrecovered leaps — are
        left out rather than guessed at.

        A line is a voice of a staff, and where several notes are written
        in one voice, the nth down from the top of them: a chorale on two
        staves has four lines in two voices. A rank that sounds in too
        little of what its voice plays is a thickening and not a line. A
        run of the same thing between the same two lines is reported once,
        with `times` saying how often: a left hand in octaves does the same
        thing in every bar for pages, and three hundred findings about it
        are three hundred ways of not saying so.

        A score with more lines than `tooMany` is not analysed at all, and
        says so: the rules are about a chorale, a quartet or a keyboard
        piece, and the fifths between a second clarinet and a cello eight
        bars apart in register are not a fact anybody can use.
      responses:
        "200":
          description: What the lines did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines: { type: integer }
                  names: { type: array, items: { type: string } }
                  tooMany:
                    type: integer
                    description: >
                      Present only where the score has too many lines to be
                      worth asking about; motions is then empty.
                  motions:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [parallel fifths, parallel octaves, parallel unisons,
                                 crossing, overlap]
                        text: { type: string }
                        fromBar: { type: integer }
                        toBar: { type: integer }
                        times: { type: integer }
                        upper: { type: string }
                        lower: { type: string }
                        ref: { type: integer, description: A notehead to point at. }

  /api/spacing:
    get:
      tags: [score]
      summary: Where the bottom of the harmony is spaced too low to speak
      description: |
        The roughness of /api/harmonics pointed outward. That one answers
        "is this chord rough" with a number; an orchestrator is asking the
        same question the other way round — "will this spacing speak down
        there" — and wants it against a bar.

        The same physics. Low notes have their partials packed close
        together in frequency, so an interval that is clear in the middle
        of the piano beats against itself an octave and a half down: a
        major third on middle C is a chord, and the same third two octaves
        lower is a rumble with no third in it. Where that happens for each
        interval is the low interval limit, written down by orchestrators
        since Rimsky-Korsakov.

        Only the lowest two notes sounding are judged, because they are the
        ones whose partials are packed close enough together to fight, and
        only where they are *held*: a bass moving through a low second on
        its way somewhere is a passing tone, and reporting those buried
        Beethoven's ninth under eight hundred findings. A spacing less than
        two semitones under its limit is not reported either — the books
        differ by about that much, so it is the width of the disagreement
        rather than a finding.

        Advice and never a fault. A piano's left hand does this all day and
        is fine, and a composer writing a low third in the bassoons may
        want exactly that rumble.
      responses:
        "200":
          description: Where the harmony sits low.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thick:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        fromBar: { type: integer }
                        toBar: { type: integer }
                        times: { type: integer }
                        low: { type: integer, description: The bottom note, as it sounds. }
                        high: { type: integer, description: The note above it. }
                        semitones: { type: integer }
                        limit:
                          type: integer
                          description: The lowest that interval is usually written on.
                        below:
                          type: integer
                          description: How far under that this one sits, in semitones.
                        ref: { type: integer, description: A notehead to point at. }

  /api/rhythm:
    get:
      tags: [score]
      summary: Where the notes fall against the beat
      description: |
        A metre is a pattern of strong and weak, and almost everything a
        rhythm does it does by agreeing with that pattern or pulling
        against it. A bar of four with the notes on one and three is the
        metre spoken plainly; the same notes a quaver late are the same
        notes and a different piece.

        `pulses` is a description and not a verdict — syncopation is not a
        fault, it is most of what makes music move. Each staff's notes are
        counted as starting on the downbeat, on another beat, or between
        beats; `syncopated` is the subset of the last that hold *across*
        the next beat, which is syncopation proper as against a note that
        merely falls between beats and stops before the next one.

        Two things are checks rather than descriptions. `odd` is bars
        holding more or less than their metre says — usually an import or
        an edit that went wrong; a bar holding a two-note tremolo is left
        out, because gscore counts the pair as the sum of its two written
        notes and MuseScore counts it as one of them. `rushed` is stretches
        written faster than the instrument can articulate, which is a fact
        about the player like a note below the bottom of an instrument: at
        least four notes in a row, because one very short note is an
        ornament and every ornament is played by leaning on it rather than
        by counting it.
      responses:
        "200":
          description: How the piece sits against its metre.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bars: { type: integer }
                  pulses:
                    type: array
                    items:
                      type: object
                      properties:
                        part: { type: integer }
                        name: { type: string }
                        notes: { type: integer }
                        downbeats: { type: integer }
                        onBeat: { type: integer }
                        offBeat: { type: integer }
                        syncopated: { type: integer }
                        bars:
                          type: array
                          items: { type: integer }
                          description: How many notes pull against the metre in each bar.
                  odd:
                    type: array
                    items:
                      type: object
                      properties:
                        bar: { type: integer }
                        held: { type: number }
                        says: { type: number }
                        text: { type: string }
                  rushed:
                    type: array
                    items:
                      type: object
                      properties:
                        part: { type: integer }
                        name: { type: string }
                        fromBar: { type: integer }
                        toBar: { type: integer }
                        notes: { type: integer }
                        each: { type: number, description: How long one of them lasts, in seconds. }
                        limit: { type: number, description: The shortest the instrument can articulate. }
                        ref: { type: integer }

  /api/melody:
    get:
      tags: [score]
      summary: What each line is made of, and which moves are worth a look
      description: |
        A melody is a shape, and the shape is made of the intervals between
        one note and the next. A line that is nearly all steps is a tune
        somebody can hum after one hearing; a line of leaps is an
        accompaniment figure, a fanfare or an arpeggio. Neither is better —
        what is worth being told is which one you have written, because a
        composer writing a vocal line and getting the second is usually not
        doing it on purpose.

        `shapes` counts each line's moves: a repeated note, a step of a
        tone or less, or a leap. `awkward` is the two moves worth more than
        a count. A leap of a major sixth or more that keeps going the same
        way leaves the ear a long way from where it started with nothing to
        hold on to; the usual advice is to turn back after a leap. And an
        augmented second is told from the minor third it sounds exactly
        like by the letters the two notes are written on — A to C is a
        third anybody sings, A to B sharp is the step singers have
        complained about since the harmonic minor was invented.

        A description, not a mark. Stravinsky's lines leap and are not
        improvable.
      responses:
        "200":
          description: What the lines are made of.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shapes:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        name: { type: string }
                        notes: { type: integer }
                        moves: { type: integer }
                        same: { type: integer }
                        steps: { type: integer }
                        leaps: { type: integer }
                        widest: { type: integer }
                        widestBar: { type: integer }
                        commonest: { type: integer }
                        up: { type: integer }
                        down: { type: integer }
                  awkward:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [leap not turned, augmented second]
                        text: { type: string }
                        line: { type: integer }
                        name: { type: string }
                        bar: { type: integer }
                        ref: { type: integer }
                        semitones: { type: integer }

  /api/contents:
    get:
      tags: [score]
      summary: What is written in the score, bar by bar
      description: |
        The one thing the editor could not be asked. Everything else answers
        a question about where the ink went or how the music sounds; this
        answers "what is written here", which is what a script needs before
        it can copy a phrase, transpose it, invert it or answer it in
        another voice.

        The whole score at once, because the console reads it once when a
        script starts and works from that: the console's verbs are
        synchronous so that a script reads as music rather than as
        plumbing, and a synchronous verb cannot go and ask.

        A length is the figure it is written as — 4 for a quarter note, 8
        for an eighth — with the dots counted separately, because a dotted
        quarter is a quarter with a dot and not a length of its own.
      responses:
        "200":
          description: Every staff, every bar, everything written in it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  staves:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        bars:
                          type: array
                          description: One entry per bar, each a list of what is in it.
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                pitch: { type: string, description: 'As written: "F#3".' }
                                length: { type: integer }
                                dots: { type: integer }
                                rest: { type: boolean }
                                chord:
                                  type: array
                                  items: { type: string }
                                  description: The other notes of a chord, lowest first.

  /api/scripts:
    get:
      tags: [score]
      summary: The programs kept with the score
      description: |
        A piece built from a process — a row, an isorhythm, a phase — is not
        fully written down by its notes. The notes are the output; the
        process is the thought, and a composer who comes back to the piece a
        year later wants the thought. So the scripts travel in the file.

        What comes back is **text**. Nothing here ever runs by itself, and
        opening a score never runs anything in it: a document that can
        execute code on being opened is a document that can attack the
        person who opens it, which is the mistake Word made and spent a
        decade undoing. The console shows what the file carries, and a
        person reads it and decides.
      responses:
        "200":
          description: The scripts, in the order they are kept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    items:
                      type: object
                      properties:
                        Name: { type: string }
                        Body: { type: string }
    post:
      tags: [score, edit]
      summary: Replace the programs kept with the score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scripts:
                  type: array
                  items:
                    type: object
                    properties:
                      Name: { type: string }
                      Body: { type: string }
      responses:
        "200": { description: How many are now kept. }
        "400": { $ref: "#/components/responses/Error" }

  /api/script/begin:
    post:
      tags: [edit]
      summary: Start a run of edits that undo together
      description: |
        A script that writes two hundred notes and comes back as two hundred
        separate undos is a script nobody will dare run. Everything between
        this and /api/script/end is taken back by one press.

        Nested begins are the same batch, and the undo goes back to before
        the outermost one: a script that calls another still undoes as the
        thing the person asked for.
      responses:
        "200": { description: The batch is open. }

  /api/script/end:
    post:
      tags: [edit]
      summary: Close it, and push the one undo
      parameters:
        - name: changed
          in: query
          description: >
            0 where the script did nothing, so that nothing is pushed — an
            undo that does nothing looks broken.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200": { description: The batch is closed. }

  /api/playback:
    get:
      tags: [play, render]
      summary: The performance as a list of sounds
      description: Every note with the moment it sounds and how long it lasts, after repeats, ties and jumps have been worked out.
      responses:
        "200":
          description: The timeline.
          content:
            application/json:
              schema: { type: object }

  /font.otf:
    get:
      tags: [render]
      summary: The music font the drawing uses
      responses:
        "200":
          description: The font.
          content:
            font/otf:
              schema: { type: string, format: binary }

  /symbol.png:
    get:
      tags: [render]
      summary: One symbol from the pack, as an image
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The symbol.
          content:
            image/png:
              schema: { type: string, format: binary }

  /keysig.svg:
    get:
      tags: [render]
      summary: A key signature, drawn on its own
      description: "For a picker: the sharps and flats as they will appear, rather than the words \"D major\"."
      parameters:
        - { name: fifths, in: query, schema: { type: integer, minimum: -7, maximum: 7 } }
        - { name: from, in: query, description: "The signature being changed from, so the naturals that cancel it are drawn.", schema: { type: integer } }
        - { name: clef, in: query, schema: { type: string, enum: [treble, bass, alto, tenor, percussion] } }
        - { name: space, in: query, schema: { type: number } }
      responses:
        "200":
          description: The drawing.
          content:
            image/svg+xml:
              schema: { type: string }

  /timesig.svg:
    get:
      tags: [render]
      summary: A time signature, drawn on its own
      parameters:
        - { name: meter, in: query, description: "As `4/4`, `6/8`, `c` or `c|`.", schema: { type: string } }
        - { name: space, in: query, schema: { type: number } }
      responses:
        "200":
          description: The drawing.
          content:
            image/svg+xml:
              schema: { type: string }

  /api/keysignatures:
    get:
      tags: [structure]
      summary: Every key signature, with its name
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/instruments:
    get:
      tags: [structure]
      summary: Every instrument a staff can be, clustered by what it is
      description: >
        The catalogue, grouped — keyboard, voice, woodwind, brass, bowed and
        plucked strings, pitched and unpitched percussion, electronic — and
        in the order a score is laid out. Each entry carries the MusicXML
        standard sound id, which is what identifies the instrument and what
        `/api/addstaff` and `/api/staff` take as `sound`; the General MIDI
        program beside it is only what plays it, and cannot tell a bass
        clarinet from a clarinet.
      parameters:
        - name: flat
          in: query
          description: >
            `1` gives the older answer instead: the named General MIDI
            programs as a flat array, with the drum kit at program -1.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: The catalogue, or the flat program list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { type: string }
                    description: The headings, in the order they are offered.
                  instruments:
                    type: array
                    items:
                      type: object
                      properties:
                        group: { type: string }
                        name: { type: string, description: "What it is called: `bass clarinet`." }
                        sound: { type: string, description: "MusicXML standard sound id: `wind.reed.clarinet.bass`." }
                        program: { type: integer, description: "General MIDI's nearest, which is what plays it." }
                        percussion: { type: boolean, description: "Read by position on a kit rather than by pitch." }
                        low: { type: integer, description: "Bottom of its written compass, as a MIDI note. Absent where unknown." }
                        high: { type: integer, description: "Top of its written compass." }

  /api/percussion:
    get:
      tags: [structure]
      summary: The drums of a kit, and which line each sits on
      parameters:
        - { name: kit, in: query, schema: { type: string } }
      responses:
        "200":
          description: The kit.
          content:
            application/json:
              schema: { type: object }

  /api/symbols:
    post:
      tags: [render]
      summary: The symbol pack this score carries
      responses:
        "200":
          description: The symbols, by name.
          content:
            application/json:
              schema: { type: object }

  /api/importsymbols:
    post:
      tags: [render]
      summary: Add symbols from a pack
      parameters:
        - { name: path, in: query, schema: { type: string } }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What came in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  added: { type: integer }
                  replaced: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /api/symbolimport:
    post:
      tags: [render]
      summary: Add one symbol from an image
      description: An XPM, PNG, GIF or JPEG sent in the body, traced into a symbol the engraver can draw.
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The symbol.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }

  # ── sound ─────────────────────────────────────────────────────────────────

  /api/play/start:
    post:
      tags: [play]
      summary: Begin playing, and get a handle to pull audio from
      description: |
        The synthesizer runs here and the audio is fetched in chunks, so a
        browser with no soundfont of its own can still play the score.
      parameters:
        - { name: from, in: query, description: "The moment to start at, in seconds.", schema: { type: number } }
      responses:
        "200":
          description: The stream.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  rate: { type: integer }
                  chunk: { type: integer }
                  duration: { type: number }
                  font: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/play/chunk:
    get:
      tags: [play]
      summary: The next piece of audio
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: frames, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Raw samples.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }

  /api/play/stop:
    post:
      tags: [play]
      summary: Stop playing
      parameters:
        - { name: id, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Status" }

  /api/soundfonts:
    get:
      tags: [play]
      summary: The soundfonts available, and which is in use
      parameters:
        - { name: font, in: query, description: "Choose one.", schema: { type: string } }
        - { name: assign, in: query, description: "Assign a staff to a voice in it.", schema: { type: string } }
      responses:
        "200":
          description: What there is.
          content:
            application/json:
              schema: { type: object }

  /api/soundfont/fetch:
    post:
      tags: [play]
      summary: Download a soundfont
      description: >
        Answers when the file has arrived, which for two hundred megabytes
        is minutes. Give a job and ask /api/soundfont/progress about it
        meanwhile to find out how far it has got.
      parameters:
        - { name: url, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - name: job
          in: query
          description: A name of your own to ask about the progress under.
          schema: { type: string }
      responses:
        "200":
          description: The font that arrived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  font: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/soundfont/progress:
    get:
      tags: [play]
      summary: How far a soundfont download has got
      description: >
        A job nobody started answers as one that has not begun rather than
        as an error, because the asking usually starts before the download
        is registered. A finished one is answered for two minutes more.
      parameters:
        - name: job
          in: query
          required: true
          description: The job the download was started under.
          schema: { type: string }
      responses:
        "200":
          description: What has arrived so far.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: integer, description: Bytes so far. }
                  total:
                    type: integer
                    description: >
                      How big it is, or 0 where the server would not say.
                  done: { type: boolean }
                  seconds:
                    type: number
                    description: >
                      How long it ran for, which stops growing when it ends.
                  bytesPerSecond: { type: number }
                  secondsLeft: { type: number }
                  error:
                    type: string
                    description: Why it failed, where it did.

  /api/soundfont/pick:
    post:
      tags: [play]
      summary: Choose a soundfont from the disk, through a panel
      responses:
        "200":
          description: What was chosen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  font: { type: string }
                  cancelled: { type: boolean }
                  unavailable: { type: boolean }

  /api/take:
    post:
      tags: [play]
      summary: Read a note recorded through the microphone
      description: >
        The body is the recording itself: mono samples, 16-bit, little-endian,
        at the rate the query gives. What comes back is what the take turns
        out to be — which note it is, how far off that note, where the sound
        starts and stops once the silence either end is taken off, and where
        in it a loop can be hidden so that a short recording holds a long
        note. A take with no findable pitch still comes back, trimmed, with
        no loop: a cymbal is a sample too.
      parameters:
        - in: query
          name: rate
          required: true
          schema: { type: integer, minimum: 8000, maximum: 192000 }
          description: The samples a second the take was recorded at.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What the recording is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hz: { type: number }
                  key: { type: integer }
                  cents: { type: integer }
                  name: { type: string }
                  frames: { type: integer }
                  seconds: { type: number }
                  loopStart: { type: integer }
                  loopEnd: { type: integer }
                  peak: { type: number }
                  quiet: { type: boolean }
                  loud: { type: boolean }
                  error:
                    type: string
                    description: >
                      Why there was nothing to read — an empty take, or one
                      with no sound in it. Words rather than a failure code:
                      it is something that happens, and the words say what to
                      do about it.
        "400":
          description: The take says no rate, or there is nothing in it.

  /api/soundfont/load:
    post:
      tags: [play]
      summary: Take a soundfont sent in the body
      parameters:
        - { name: name, in: query, schema: { type: string } }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The font.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  font: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /api/soundfont/presets:
    get:
      tags: [play]
      summary: The voices inside a soundfont
      parameters:
        - { name: font, in: query, schema: { type: string } }
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/soundfont/collection:
    get:
      tags: [play]
      summary: The catalogue of soundfonts that can be downloaded
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema: { type: object }

  # ── the program itself ────────────────────────────────────────────────────

  /api/undo:
    post:
      tags: [app]
      summary: Take back the last edit
      responses:
        "200": { $ref: "#/components/responses/UndoState" }

  /api/redo:
    post:
      tags: [app]
      summary: Do it again
      responses:
        "200": { $ref: "#/components/responses/UndoState" }

  /api/cursor:
    post:
      tags: [app]
      summary: Remember where the writing cursor is
      description: Saved with the file, so opening it again puts the cursor back.
      parameters:
        - $ref: "#/components/parameters/part"
        - $ref: "#/components/parameters/measure"
        - $ref: "#/components/parameters/at"
        - $ref: "#/components/parameters/step"
      responses:
        "200": { $ref: "#/components/responses/Status" }

  /api/view:
    post:
      tags: [app]
      summary: What the drawing shows — staff names, bar numbers, the metronome mark
      description: >-
        Decisions about the drawing and not about the music. Anything left
        out is left as it is, and the answer says what everything is now.
      parameters:
        - { name: names, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: numbers, in: query, schema: { type: string, enum: ["0", "1"] } }
        - name: multirest
          in: query
          description: >-
            Bars of rest counted rather than drawn one at a time. The bars
            are still there and still played.
          schema: { type: string, enum: ["0", "1"] }
        - name: tempomark
          in: query
          description: >-
            The metronome mark and the word beside it, over the first bar.
            Hidden, the piece still plays at that speed.
          schema: { type: string, enum: ["0", "1"] }
        - name: concert
          in: query
          description: >-
            The score as it sounds rather than as each player reads it.
            What is stored does not change: writing on a transposing staff
            still goes in as what its player reads.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: What it shows now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  names: { type: boolean }
                  numbers: { type: boolean }
                  multirest: { type: boolean }
                  tempomark: { type: boolean }
                  concert: { type: boolean }
                  changed:
                    type: array
                    description: Which of them this request actually changed.
                    items: { type: string }

  /api/settings:
    post:
      tags: [app]
      summary: The program's own settings
      description: >
        Keyboard shortcuts, the playback soundfont, whether a .gscore
        carries a PDF of itself, whether bars are kept to the meter, and
        how big the interface is drawn. These belong to the person and the
        machine rather than to any score, so they are remembered here and
        not in the file.
      parameters:
        - { name: playbackFont, in: query, schema: { type: string } }
        - name: recordFont
          in: query
          description: >-
            The soundfont a recording is rendered through, which need not be
            the one the editor plays through: a light bank answers while you
            type, and the big one is worth the wait once. Empty means
            whichever the editor plays through.
          schema: { type: string }
        - name: instrumentFont
          in: query
          description: >-
            Which soundfont to play one instrument through, written
            sound=path — "strings.violin=/Sounds/Violin.sf2". Nothing after
            the = takes it off again. May be given more than once; each is
            one instrument, so that changing one does not lose the others.
            Held against the instrument and not against any staff, and kept
            on this machine rather than in the score, because the path names
            a file on this disk.
          schema: { type: string }
        - { name: scorePDF, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: trackBarlines, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: lang, in: query, schema: { type: string } }
        - name: uiScale
          in: query
          description: >-
            How big to draw the menus, the palette and the panels, where 1
            is the size they were designed at. Between 0.75 and 2: below
            that the labels stop being legible, and past it the menus no
            longer fit a laptop screen.
          schema: { type: number, minimum: 0.75, maximum: 2 }
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { type: object }

  /api/openbrowser:
    post:
      tags: [app]
      summary: Open a path or a URL in the platform's browser
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Status" }

components:
  parameters:
    part:
      name: part
      in: query
      description: The staff, counting from zero.
      schema: { type: integer, default: 0 }
    measure:
      name: measure
      in: query
      description: The bar, counting from zero.
      schema: { type: integer, default: 0 }
    at:
      name: at
      in: query
      description: |
        Which element in the bar, counting from one and naming the one before
        the cursor. `0` or a number past the end means the last one.
      schema: { type: integer }
    sel:
      name: sel
      in: query
      description: |
        Several elements at once, as `staff:measure:index` triples separated
        by commas and counting from zero — `0:0:0,0:0:1`. Where a route takes
        this and `part`/`measure`/`at`, this wins.
      schema: { type: string }
    step:
      name: step
      in: query
      description: |
        A position on the staff: 0 is the bottom line, each step the next line
        or space up, negative below. The clef decides what note that is.
      schema: { type: integer }

  responses:
    Status:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, examples: [ok] }
    Changed:
      description: How many things it applied to.
      content:
        application/json:
          schema:
            type: object
            properties:
              changed: { type: integer }
    UndoState:
      description: What can be taken back now.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              canUndo: { type: boolean }
              canRedo: { type: boolean }
              tune: { type: integer }
    Error:
      description: |
        Refused, with one line of plain text saying why — written to be read
        rather than matched against.
      content:
        text/plain:
          schema: { type: string, examples: ["no such measure"] }

  schemas:
    NoteValue:
      type: string
      description: How long a note lasts, before any dots.
      enum:
        - double whole
        - whole
        - half
        - quarter
        - eighth
        - sixteenth
        - thirty-second
        - sixty-fourth
        - hundred-twenty-eighth

    Accidental:
      type: string
      enum: [none, natural, sharp, flat, double sharp, double flat]

    Info:
      type: object
      properties:
        version: { type: string }
        filename: { type: string }
        unsaved:
          type: boolean
          description: Edited since it was last written out.
        title: { type: string }
        subtitle: { type: string }
        composer: { type: string }
        tempo: { type: integer }
        tempoUnit: { $ref: "#/components/schemas/NoteValue" }
        tempoDotted: { type: boolean }
        tempoText: { type: string }
        tempoParens: { type: boolean }
        tempoChanges:
          type: object
          description: Speeds written partway through, keyed by the bar they start at.
          additionalProperties:
            type: object
            properties:
              bpm: { type: integer }
              unit: { type: string }
              dotted: { type: boolean }
              text: { type: string }
              parens: { type: boolean }
        formats:
          type: array
          description: |
            The formats that can be opened, by name — "ABC", "MuseScore",
            "MusicXML", "NoteWorthy", "gscore". Not the ones that can be
            written: for those, see /api/convert.
          items: { type: string }
        tunes:
          type: array
          description: The pieces in a tune book, listed only when there is more than one.
          items:
            type: object
            properties:
              index: { type: integer }
              title: { type: string }
        canUndo: { type: boolean }
        canRedo: { type: boolean }
        movements:
          type: array
          description: >-
            Where each movement begins and ends, listed only when a score has
            more than one. Bars are numbered from one in every movement, so a
            bar number means nothing without saying which movement it is in:
            "go to bar four" is the fourth bar of the movement the cursor is
            standing in. The bounds are bars of the whole score, counted from
            zero, so everything else — the clickable regions, the
            performance, the cursor — goes on meaning what it meant.
          items:
            type: object
            properties:
              first: { type: integer }
              last: { type: integer }
              title: { type: string }
        markers:
          type: integer
          description: >-
            How many rehearsal marks the score carries, so the editor can
            offer the next letter when one is written.
        current:
          type: integer
          description: Which piece of a tune book is open.
        native:
          type: boolean
          description: Running inside the desktop application.
        local:
          type: boolean
          description: The browser is on this machine, so paths may be used.
        inBrowser:
          type: boolean
          description: The core is the page itself, as WebAssembly, with no disk behind it.
        warning:
          type: string
          description: One line about the file that was opened.
        log:
          type: array
          description: Everything in the file that could not be read, line by line.
          items: { type: string }
        cursor:
          type: object
          properties:
            part: { type: integer }
            measure: { type: integer }
            at: { type: integer }
            step: { type: integer }
        parts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              instrument: { type: string }
              clef: { type: string }
              key: { type: string }
              time: { type: string }
              measures: { type: integer }
              notes: { type: integer }
              sound:
                type: string
                description: >-
                  Which instrument this staff is, by its MusicXML standard
                  sound id. The instrument above is only the General MIDI
                  program that plays it, which cannot tell a bass clarinet
                  from a clarinet.
              transposeSemitones:
                type: integer
                description: How far below what is written this staff sounds.
              hidden: { type: boolean }
              tab:
                type: object
                description: >-
                  The tuning this staff is written in, where it is written
                  as tablature. Absent otherwise, which is what the editor
                  reads to know whether a typed digit is a fret.
                properties:
                  tuning: { type: string }
                  strings:
                    type: array
                    description: The open strings from the top line of the tab down.
                    items: { type: string }
                  frets: { type: integer }
              mirrorOf:
                type: integer
                description: >-
                  The staff this one draws the music of, where it holds
                  none of its own — the tablature half of a
                  notation-and-tablature pair. Absent where the staff has
                  its own music.

    PageSetup:
      type: object
      properties:
        papers:
          type: array
          description: The sizes on offer, in millimetres, plus "custom".
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              width: { type: number }
              height: { type: number }
        paper: { type: string }
        landscape: { type: boolean }
        width:
          type: number
          description: What the paper comes to in millimetres, the way round it is printed.
        height: { type: number }
        marginLeft: { type: number }
        marginRight: { type: number }
        marginTop: { type: number }
        marginBottom: { type: number }
        space:
          type: number
          description: The staff size in points, or 0 to fit the music to the page.
        chosen:
          type: boolean
          description: >-
            Whether anything was chosen at all. False means the score
            follows the program's own defaults and will keep following
            them as they change.

    PartReach:
      type: object
      properties:
        part: { type: integer, description: Which staff, counting from zero. }
        name: { type: string, description: What the staff is called on the page. }
        instrument: { type: string, description: What it is played on. }
        notes: { type: integer, description: How many sounding notes are written on it. }
        percussion:
          type: boolean
          description: >
            A staff of drums. Nothing else is filled in: its lines are
            places on a kit rather than pitches, so a bass drum written on
            the bottom line is not a bass drum playing low.
        lowest: { $ref: "#/components/schemas/PlacedNote" }
        highest: { $ref: "#/components/schemas/PlacedNote" }
        tessitura:
          type: object
          description: >
            Where the part spends its time rather than where it reaches:
            the stretch holding the middle four fifths of the sounding
            time, so one touched high note does not make a part a high
            part. This is what a player means by "this part sits high".
          properties:
            low: { type: integer }
            high: { type: integer }
        playable:
          type: object
          description: What the instrument can play, left out where gscore does not know it.
          properties:
            low: { type: integer }
            high: { type: integer }
        easy:
          type: object
          description: Where inside that it plays without the player working for it.
          properties:
            low: { type: integer }
            high: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/ReachFinding" }

    PlacedNote:
      type: object
      properties:
        midi: { type: integer, description: The sounding pitch. }
        name: { type: string, description: That pitch written out. }
        bar: { type: integer, description: Which bar it is in, counting from zero. }
        ref: { type: integer, description: The notehead, as the engraver numbers them. }

    ReachFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [impossible, strain]
          description: >
            impossible is a fact — the instrument does not have the note.
            strain is a judgement — it has it but would rather not hold it.
        text: { type: string, description: What it is, in a sentence somebody can act on. }
        fromBar: { type: integer }
        toBar: { type: integer }
        notes: { type: integer, description: How many notes or bars the finding is about. }
        worst: { $ref: "#/components/schemas/PlacedNote" }

    Chord:
      type: object
      description: >
        What a set of sounding notes is called. A set that is not a chord
        gscore names comes back with named false and nothing else filled
        in: a wrong name is read, believed and acted on.
      properties:
        root: { type: integer, description: The pitch class it is built on, 0 for C. }
        quality: { type: string, description: 'What is built on it: major, dominant seventh.' }
        bass: { type: integer, description: The pitch class at the bottom. }
        inversion:
          type: integer
          description: Which chord tone the bass is — 0 the root, 1 the third, and so on.
        name: { type: string }
        named: { type: boolean }

    Fit:
      type: object
      description: >
        How good a key reading is, in two numbers that mean different
        things. correlation says how like a key the music is at all;
        margin says how far clear the winner is of the next best key, and
        it is the one that says whether there is an answer or a tie. One
        note correlates 0.68 with all twenty-four keys at once and is
        nothing at all clear of any of them; a phrase that really is in a
        key comes out a quarter or more clear. Below about 0.15 the answer
        is worth showing as unsettled rather than stating.
      properties:
        correlation: { type: number }
        margin: { type: number }

    Harmonics:
      type: object
      properties:
        chord: { $ref: "#/components/schemas/Chord" }
        key:
          type: object
          description: >
            The key the music is in where this chord falls, read from the
            phrase around it rather than from the key signature. A
            signature is written once and the music moves through keys
            inside it all the time.
          properties:
            tonic: { type: integer }
            minor: { type: boolean }
        keyName:
          type: string
          description: >
            That key written out, spelled the way the page is spelled: the
            dominant of a piece in four sharps is G♯ major, not A♭ major.
        keyFit: { $ref: "#/components/schemas/Fit" }
        numeral:
          type: string
          description: >
            What the chord is doing in that key, with the figures for its
            inversion. Empty where the chord has no name.
        function:
          type: string
          description: 'The word a listener would use: tonic, dominant, subdominant.'
        at: { type: number, description: The moment this describes, in seconds. }
        duration: { type: number, description: How long the whole performance is. }
        verdict:
          type: string
          description: The roughness in words, for reading at a glance.
        roughness:
          type: number
          description: |
            How much the partials grate against each other, in semitones:
            1 is as rough as two notes a semitone apart, averaged over the
            intervals in the chord. Loudness is deliberately left out — a
            quiet minor second is still a minor second.
        staves:
          type: array
          description: What each staff is called, for labelling.
          items: { type: string }
        notes:
          type: array
          description: What is sounding, as it sounds — a clarinet's written C arrives here as the B flat heard.
          items:
            type: object
            properties:
              midi: { type: integer }
              name: { type: string }
              freq: { type: number }
              part: { type: integer }
              velocity: { type: integer }
              ref: { type: integer, description: The notehead it came from. }
        partials:
          type: array
          description: Every note's harmonic series, as far up as asked for.
          items:
            type: object
            properties:
              note: { type: integer, description: Which of the notes it belongs to. }
              n: { type: integer, description: Which harmonic — 1 is the note itself. }
              freq: { type: number }
              amp: { type: number }
        coincident:
          type: array
          description: |
            Partials of different notes landing together, nearest first.
            This is what consonance is made of: a fifth is smooth because
            the third harmonic of the lower note is the second of the upper.
          items:
            type: object
            properties:
              a: { type: integer }
              b: { type: integer }
              na: { type: integer }
              nb: { type: integer }
              freq: { type: number }
              cents: { type: number }
              beats: { type: number, description: How many times a second they beat. }
        intervals:
          type: array
          items:
            type: object
            properties:
              a: { type: integer }
              b: { type: integer }
              semitones: { type: integer }
              name: { type: string }
              ratio: { type: string, description: The whole-number ratio the interval is named after. }
              cents:
                type: number
                description: How far the tempered interval is from the just one; positive is wider.

    Hits:
      type: object
      description: Where the engraver put everything, in staff spaces.
      properties:
        page: { type: object }
        strip: { type: object }
        staffHeight: { type: number }
        hits:
          type: array
          description: One per drawn bar.
          items:
            type: object
            properties:
              part: { type: integer }
              measure: { type: integer }
              x0: { type: number }
              x1: { type: number }
              staffTop:
                type: number
                description: The y of the staff's top line.
              staffHeight: { type: number }
              clef: { type: string }
              fifths: { type: integer }
              keyChange: { type: boolean }
              timeChange: { type: boolean }
              full:
                type: boolean
                description: The bar already holds as much time as its meter allows.
              ahead:
                type: boolean
                description: >-
                  The blank bar drawn past the end of the music, which is
                  somewhere to click and not a bar of the piece. Anything
                  counting bars has to leave it out.
              elements:
                type: array
                items:
                  type: object
                  properties:
                    ref: { type: integer }
                    index: { type: integer }
                    x: { type: number }
                    y:
                      type: number
                      description: The topmost notehead.
                    y2:
                      type: number
                      description: The lowest; they differ only for a chord.
                    width: { type: number }
                    at:
                      type: number
                      description: Where in the bar it begins, as a fraction — time, not distance.
                    steps:
                      type: array
                      description: The staff steps of its noteheads, lowest first.
                      items: { type: integer }
                    kind: { type: string, enum: [note, chord, rest, symbol] }
                    chord: { type: string }
                    chordFrets: { type: string }
        barlines: { type: array, items: { type: object } }
        headers: { type: array, items: { type: object } }
        strips:
          type: array
          description: The band over each bar, which is how a whole bar is picked up.
          items: { type: object }
        dynamics: { type: array, items: { type: object } }
        hairpins: { type: array, items: { type: object } }
        arcs:
          type: array
          description: >
            Every tie and slur on the page, as the curve it was drawn as:
            both ends and the control point between them. A box round a slur
            would be a box round the music it arcs over, so a click is
            measured against the curve itself. `from` and `to` are the notes
            at its ends, `step` the notehead of a chord a tie left from, and
            `kind` is "tie" or "slur". A curve cut at a line break is two of
            these, both naming the whole curve.
          items:
            type: object
            properties:
              part: { type: integer }
              measure: { type: integer }
              from: { type: integer }
              to: { type: integer }
              step: { type: integer }
              kind: { type: string, enum: [tie, slur] }
              x1: { type: number }
              y1: { type: number }
              cx: { type: number }
              cy: { type: number }
              x2: { type: number }
              y2: { type: number }
        tremolos:
          type: array
          description: >
            The beams of each two-note tremolo. They are the only thing on
            the page that stands for the mark, so they are what a click on
            it finds; from and to name the two notes it alternates between.
          items: { type: object }
        tuplets:
          type: array
          description: >
            Each group's figure, and its bracket where it has one, so the
            grouping can be pointed at and taken off; from and to name the
            first and last notes of the group. Over a beamed group the box
            is the figure alone, since the notes are directly under it.
          items:
            type: object
            properties:
              part: { type: integer }
              measure: { type: integer }
              from: { type: integer }
              to: { type: integer }
              x: { type: number }
              y: { type: number }
              width: { type: number }
              height: { type: number }
              figure: { type: integer }
              bracketed: { type: boolean }
        tempos: { type: array, items: { type: object } }
