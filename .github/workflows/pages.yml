# Build the gscore web site and publish it to GitHub Pages.
#
# What lands at https://stricaud.github.io/gscore/ :
#
#   /          the front page, with music in it that plays and can be shared
#   /app/      the editor — the whole program compiled to WebAssembly, the
#              same one as the desktop build, with no server behind it
#   /scores/   every sample, engraved by gscore, in every format it writes
#   /docs/     the markdown in docs/, as pages
#
# Pages must be set to "GitHub Actions" as its source, once, in the
# repository's Settings → Pages.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run already under way is left to finish rather
# than cancelled, so a half-published site is never served.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only main is published. The push trigger already says so; this covers
    # a run started by hand, which can be dispatched from any branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the core
        # Without cgo. The desktop window wraps the platform's own web view,
        # which on Linux means WebKitGTK headers the runner does not have —
        # and the page build does not use it, since a browser is the window
        # there. The !cgo build of internal/desktop stands in.
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

      - name: Build the site
        run: sh web/build.sh web/dist

      - name: Check what was built
        run: |
          set -eu
          # The front page, the editor, and the pieces that make each work.
          for f in index.html site.css hero.js share.js font.otf \
                   app/index.html app/gscore.wasm app/wasm_exec.js \
                   app/boot.js app/share.js app/app.js \
                   docs/index.html scores/index.html; do
            test -s "web/dist/$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          # A score page per sample, with the exports the gallery offers.
          for abc in samples/*.abc; do
            id=$(basename "$abc" .abc)
            for ext in html pdf mid musicxml ly abc; do
              test -s "web/dist/scores/$id.$ext" \
                || { echo "missing: scores/$id.$ext" >&2; exit 1; }
            done
          done

          # Every file every page asks for has to be beside it. A page that
          # loads a script which is not there fails in the browser and
          # nowhere else, so it is checked here instead — across the whole
          # site, not only the front page.
          python3 - <<'PY'
          import os, re, sys
          root = "web/dist"
          pat = re.compile(r'(?:src|href)="([^"#?][^"]*?)"')
          missing = []
          checked = 0
          for dirpath, _, files in os.walk(root):
              for f in files:
                  if not f.endswith(".html"):
                      continue
                  page = os.path.join(dirpath, f)
                  html = open(page, encoding="utf-8", errors="replace").read()
                  for ref in set(pat.findall(html)):
                      if ref.startswith(("http://", "https://", "data:", "mailto:", "//")):
                          continue
                      checked += 1
                      target = os.path.normpath(os.path.join(dirpath, ref.split("?")[0]))
                      if not os.path.exists(target) and \
                         not os.path.exists(target.rstrip("/") + "/index.html"):
                          missing.append("%s refers to %s" % (os.path.relpath(page, root), ref))
          print("checked %d references across the site" % checked)
          for m in sorted(set(missing)):
              print("  " + m, file=sys.stderr)
          sys.exit(1 if missing else 0)
          PY

          # The front page carries the music itself: the engraved drawing and
          # the performance that goes with it, one of each per sample. If the
          # substitution ever silently did nothing, the page would still look
          # fine here and be empty in a browser.
          pieces=$(grep -c '<div class="piece"' web/dist/index.html)
          want=$(ls samples/*.abc | wc -l | tr -d ' ')
          [ "$pieces" = "$want" ] || {
            echo "the front page holds $pieces scores, and there are $want samples" >&2
            exit 1; }
          grep -q 'class="sound"' web/dist/index.html || {
            echo "the front page has no performance data in it" >&2; exit 1; }
          grep -q 'class="gscore-score"' web/dist/index.html || {
            echo "the front page has no engraved music in it" >&2; exit 1; }

          # The site is published under a path, not at the root of a domain,
          # so an asset asked for as "/font.otf" is looked for on the domain
          # root and is not there. Requests the WebAssembly core answers are
          # fine absolute — the shim intercepts those before they go out —
          # but a file the browser loads itself must be relative.
          if grep -nE '(url\(|src=|href=)"?/[a-zA-Z]' \
               web/dist/site.css web/dist/index.html \
               web/dist/app/style.css web/dist/app/index.html; then
            echo "absolute asset path above: it will 404 under /gscore/" >&2
            exit 1
          fi
          echo "editor: $(du -h web/dist/app/gscore.wasm | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already. Choosing "GitHub Actions" as
          # the source in Settings does not create the site itself, and the
          # site is not created until something deploys to it — so without
          # this the first run has nowhere to go and fails here.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
