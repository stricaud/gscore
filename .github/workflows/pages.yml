# Build the gscore web site and publish it to GitHub Pages.
#
# What lands at https://stricaud.github.io/gscore/ :
#
#   /          the front page, with music in it that plays and can be shared
#   /app/      the editor — the whole program compiled to WebAssembly, the
#              same one as the desktop build, with no server behind it
#   /scores/   every sample, engraved by gscore, in every format it writes
#   /docs/     the markdown in docs/, as pages
#
# Pages must be set to "GitHub Actions" as its source, once, in the
# repository's Settings → Pages.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run already under way is left to finish rather
# than cancelled, so a half-published site is never served.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only main is published. The push trigger already says so; this covers
    # a run started by hand, which can be dispatched from any branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the core
        # Without cgo. The desktop window wraps the platform's own web view,
        # which on Linux means WebKitGTK headers the runner does not have —
        # and the page build does not use it, since a browser is the window
        # there. The !cgo build of internal/desktop stands in.
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

      - name: Build the site
        run: sh web/build.sh web/dist

      - name: Check what was built
        run: |
          set -eu
          # The front page, the editor, and the pieces that make each work.
          for f in index.html site.css hero.js share.js font.otf \
                   app/index.html app/gscore.wasm app/wasm_exec.js \
                   app/boot.js app/share.js app/app.js \
                   docs/index.html scores/index.html; do
            test -s "web/dist/$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          # A score page per sample, with the exports the gallery offers.
          # Samples are not all ABC — a piano rag arrives as compressed
          # MusicXML — so the source is whatever it was written in.
          for src in samples/*; do
            case "$src" in
            *.abc|*.mxl|*.musicxml|*.xml|*.mscz|*.mscx|*.nwctxt|*.gscore) ;;
            *) continue ;;
            esac
            id=$(basename "${src%.*}")
            for want in html pdf mid musicxml ly; do
              test -s "web/dist/scores/$id.$want" \
                || { echo "missing: scores/$id.$want" >&2; exit 1; }
            done
            test -s "web/dist/scores/$(basename "$src")" \
              || { echo "missing the source: scores/$(basename "$src")" >&2; exit 1; }
          done

          # Every file every page asks for has to be beside it. A page that
          # loads a script which is not there fails in the browser and
          # nowhere else, so it is checked here instead — across the whole
          # site, not only the front page.
          python3 - <<'PY'
          import os, re, sys
          root = "web/dist"
          # A reference may carry a #fragment, and one that does is still a
          # reference to a file. The pattern used to refuse any href that so
          # much as began with a "#", and then tested the whole of
          # "page.html#section" as though it were a file name — so every
          # link from one page to a section of another failed the build for
          # pointing at something that was there all along. The fragment is
          # split off below and checked as what it is.
          pat = re.compile(r'(?<![-\w])(?:src|href)="([^"?][^"]*?)"')
          # The markup, with the inside of every script and every <pre>
          # taken out.
          #
          # Both hold text rather than page furniture, and text that looks
          # like markup is still text. A page that builds an iframe for
          # the reader to copy writes src="' + HERE + '" in its script,
          # which is a working line of JavaScript; a page showing the
          # reader what to paste prints src="…?player=1" inside a <pre>,
          # which is an example. Neither is a file anybody can be asked to
          # put on disk, and checking them failed the build for being
          # documentation.
          #
          # The opening tags are left in place, so <script src="…"> is
          # still checked — it is the one reference on such a line that is
          # really loaded.
          body = re.compile(
              r'(<script\b[^>]*>).*?(</script\s*>)'
              r'|(<pre\b[^>]*>).*?(</pre\s*>)',
              re.IGNORECASE | re.DOTALL)
          keep = lambda m: "".join(g for g in m.groups() if g)
          missing = []
          checked = 0
          # The ids on each page, read once and kept: a document of ninety
          # entries is linked to from every chapter, and reading it again
          # for each link is reading it ninety times.
          anchors = {}
          def has_anchor(path, frag):
              if path not in anchors:
                  try:
                      s = open(path, encoding="utf-8", errors="replace").read()
                  except OSError:
                      return False
                  anchors[path] = set(re.findall(r'(?:id|name)="([^"]+)"', s))
              return frag in anchors[path]
          for dirpath, _, files in os.walk(root):
              for f in files:
                  if not f.endswith(".html"):
                      continue
                  page = os.path.join(dirpath, f)
                  html = open(page, encoding="utf-8", errors="replace").read()
                  html = body.sub(keep, html)
                  for ref in set(pat.findall(html)):
                      if ref.startswith(("http://", "https://", "data:", "mailto:", "//")):
                          continue
                      checked += 1
                      path, _, frag = ref.split("?")[0].partition("#")
                      # No path at all is a link within this page.
                      target = os.path.normpath(os.path.join(dirpath, path)) if path else page
                      if os.path.isdir(target):
                          target = os.path.join(target, "index.html")
                      if not os.path.exists(target):
                          alt = target.rstrip("/") + "/index.html"
                          if not os.path.exists(alt):
                              missing.append("%s refers to %s" % (os.path.relpath(page, root), ref))
                              continue
                          target = alt
                      # And the fragment names something on the page it
                      # points at. A link to a heading that has been renamed
                      # lands at the top of the document and says nothing
                      # about it, which is the quiet half of a broken link.
                      if frag and target.endswith(".html") and not has_anchor(target, frag):
                          missing.append("%s refers to %s — no such anchor"
                                         % (os.path.relpath(page, root), ref))
          print("checked %d references across the site" % checked)
          for m in sorted(set(missing)):
              print("  " + m, file=sys.stderr)
          sys.exit(1 if missing else 0)
          PY

          # The front page carries the music itself: the engraved drawing and
          # the performance that goes with it, one of each per sample. If the
          # substitution ever silently did nothing, the page would still look
          # fine here and be empty in a browser.
          pieces=$(grep -c '<div class="piece"' web/dist/index.html)
          want=$(ls web/dist/scores/*.html | wc -l | tr -d ' ')
          want=$((want - 1))   # the gallery's own index
          [ "$pieces" = "$want" ] || {
            echo "the front page holds $pieces scores, and there are $want samples" >&2
            exit 1; }
          # The front page shows each piece as an image of the engraving and
          # hands over to the editor when somebody presses play, so what it
          # must carry is a picture per piece, not the drawing itself.
          for src in samples/*; do
            case "$src" in
            *.abc|*.mxl|*.musicxml|*.xml|*.mscz|*.mscx|*.nwctxt|*.gscore) ;;
            *) continue ;;
            esac
            id=$(basename "${src%.*}")
            # The drawing on its own, which the front page fetches, and the
            # standalone one somebody downloads.
            for f in "$id.inline.svg" "$id.svg"; do
              test -s "web/dist/scores/$f" \
                || { echo "missing: scores/$f" >&2; exit 1; }
            done
            grep -q "data-id=\"$id\"" web/dist/index.html \
              || { echo "the front page does not offer $id" >&2; exit 1; }
          done
          # And the page stays light: the drawings are files beside it, not
          # a megabyte of SVG parsed into it.
          # The page itself stays small: the drawings are files it fetches,
          # not a megabyte of SVG written into it.
          size=$(wc -c < web/dist/index.html)
          [ "$size" -lt 65536 ] || {
            echo "the front page is $size bytes; the engravings have got into it" >&2
            exit 1; }

          # The site is published under a path, not at the root of a domain,
          # so an asset asked for as "/font.otf" is looked for on the domain
          # root and is not there. Requests the WebAssembly core answers are
          # fine absolute — the shim intercepts those before they go out —
          # but a file the browser loads itself must be relative.
          if grep -nE '(url\(|src=|href=)"?/[a-zA-Z]' \
               web/dist/site.css web/dist/index.html \
               web/dist/app/style.css web/dist/app/index.html; then
            echo "absolute asset path above: it will 404 under /gscore/" >&2
            exit 1
          fi
          echo "editor: $(du -h web/dist/app/gscore.wasm | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already. Choosing "GitHub Actions" as
          # the source in Settings does not create the site itself, and the
          # site is not created until something deploys to it — so without
          # this the first run has nowhere to go and fails here.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
